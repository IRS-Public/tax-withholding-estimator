<fg-collection
        th:attr="path=${path}, condition=${condition}, operator=${operator}, disallowEmpty=${disallowEmpty}",
        th:with="
            collectionName=#{components.fg-collection.paths.__${path}__.name},
            determiner=#{components.fg-collection.paths.__${path}__.determiner},
            removeModalId='fg-collection-remove-'+${collectionName.replaceAll(' ', '-').strip()}+'-modal',
            collectionNameHeading=${collectionName.substring(0,1).toUpperCase() + collectionName.substring(1)}
        "
>
    <div class="fg-collection__item-container margin-bottom-3">
        <template class="fg-collection__item-template">
            <details class="fg-collection__details">
                <summary class="fg-collection__item-button">
                    <h4>
                        <span th:text="${collectionNameHeading}"></span>
                        <span class="collection-item-number"></span>
                    </h4>
                </summary>
                <div class="details-content fg-collection__item-content">
                    <div class="fg-collection-item__fields" th:utext="${collectionFacts}"></div>
                    <div class="fg-collection-item__controls">
                        <modal-link th:attr="for=${removeModalId}" class="fg-collection-item__remove-item">
                            <svg aria-hidden="true" role="img" focusable="false"
                                class="usa-icon usa-icon--size-3 margin-left-neg-1 margin-y-neg-05">
                                <use href="/app/tax-withholding-estimator/resources/vendor/uswds-3.13.0/img/sprite.svg#delete"></use>
                            </svg>
                            <span>
                                <th:block th:text="#{components.fg-collection.buttons.remove(${collectionName})}"></th:block>
                                <span class="collection-item-number"></span>
                            </span>
                        </modal-link>
                    </div>
                </div>
            </details>
        </template>
    </div>
    <button type="button" class="fg-collection__add-item usa-button usa-button--outline">
        <svg aria-hidden="true" role="img" focusable="false"
            class="usa-icon usa-icon--size-3 margin-left-neg-1 margin-y-neg-05">
            <use href="/app/tax-withholding-estimator/resources/vendor/uswds-3.13.0/img/sprite.svg#add"></use>
        </svg>
        <span class="fg-collection__without-determiner" th:text="#{components.fg-collection.buttons.add(${collectionName})}"></span>
        <span class="fg-collection__with-determiner" th:text="#{components.fg-collection.buttons.add-with-determiner(${collectionName}, ${determiner})}"></span>
    </button>
    <div th:replace="~{nodes/modal-dialog :: modal(
            modalId=${removeModalId},
            modalHeading=#{components.fg-collection.remove-item-modal.heading.remove(${collectionName})},
            modalContent=#{components.fg-collection.remove-item-modal.body(${collectionName})},
            footerContent=~{:: removeItemModalFooter}
    )}">
        <div class="usa-modal__button-group" th:fragment="removeItemModalFooter">
            <button
                    type="button"
                    class="usa-button fg-collection__remove-item-modal__button-confirm"
                    data-close-modal
                    th:text="#{components.fg-collection.remove-item-modal.footer.confirm(${collectionName})}">
                Yes, remove this item
            </button>
            <button
                    type="button"
                    class="usa-button usa-button--outline"
                    data-close-modal
                    th:text="#{components.fg-collection.remove-item-modal.footer.cancel(${collectionName})}">
                No, keep this item
            </button>
        </div>
    </div>
</fg-collection>
