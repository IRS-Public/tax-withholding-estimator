  h4-f1b89b: Tus retenciones
  h4-7d0acd: Las retenciones de tu esposo(a)
  h4-9cfae7: Revisa tus retenciones cada enero
  p-47f861: Esto te ayudará a decidir si necesitas hacer cambios para el año fiscal.
  modal-what-is-form-w-4:
    heading: ¿Qué es un Formulario W-4?
    p-52482e: Necesitas enviar el Formulario W-4 a cada uno de tus empleadores para ayudarles a retener la cantidad correcta de impuestos de tus cheques a lo largo del año.
    p-14dbf9: Retener impuestos en la tasa correcta asegura que no retengas en exceso y recibas un pago menor en cada cheque, o que retengas muy poco y debas mucho dinero o tal vez multas a fin de año.
    p-a2bc8b: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/forms-pubs/about-form-w-4">Conoce más sobre el Formulario W-4.</a>
  modal-what-is-form-w-4p:
    heading: ¿Qué es un Formulario W-4P?
    p-f9b7ba: Necesitas enviar el Formulario W-4P a tu proveedor de pensión o anualidad para ayudarles a retener la cantidad correcta de impuestos de tus pagos de pensión a lo largo del año.
    p-7ca1e5: Retener impuestos en la tasa correcta asegura que no retengas en exceso y recibas un pago menor en cada cheque, o que retengas muy poco y debas mucho dinero o tal vez multas a fin de año.
    p-d5bee2: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/forms-pubs/about-form-w-4-p">Conoce más sobre el Formulario W-4P.</a>
  modal-what-is-form-w-4-and-w-4p:
    heading: ¿Qué es un Formulario W-4 y W-4P?
    p-a06431: Necesitas enviar el Formulario W-4 a cada uno de tus empleadores, o el Formulario W-4P a tu proveedor de pensión o anualidad para ayudarles a retener la cantidad correcta de impuestos de tus cheques o pagos de pensión a lo largo del año.
    p-790f19: Retener impuestos en la tasa correcta asegura que no retengas en exceso y recibas un pago menor en cada cheque, o evitar que retengas muy poco y debas mucho dinero o tal vez multas a fin de año.
    p-a2bc8b: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/forms-pubs/about-form-w-4">Conoce más sobre el Formulario W-4.</a>
    p-d5bee2: <a target="_blank" class="usa-link" href="https://www.irs.gov/forms-pubs/about-form-w-4-p">Conoce más sobre el Formulario W-4P.</a>
  modal-why-step-1-c:
    heading: ¿Por qué se recomienda esto?
    p-e46111: Este es el estado civil que elegiste en el paso 1 del estimador.
    p-205b43: Tu estado civil afecta tu deducción estándar y los créditos y deducciones para los que eres elegible.
  modal-why-w-4p-step-2:
    heading: ¿Por qué se recomienda esto?
    p-8310ca: Este paso te ayuda a decidir el trabajo o pensión del que debes retener impuestos.
    p-1eb372: Ya completaste este paso al utilizar el estimador.
  modal-why-w-4-step-2-c:
    heading: ¿Por qué se recomienda esto?
    p-7790ad: Aquí es donde puedes indicar si tienes más de un trabajo, o si tú y tu esposo(a) trabajan (si presentan una declaración juntos).
    p-6eeb8d: No marques esta casilla porque el estimador ya toma en cuenta múltiples trabajos (si los ingresaste) para que no tengas que darle esta información a tu empleador.
  modal-why-step-3:
    heading: ¿Por qué se recomienda esto?
    p-ba1822: El paso 3 muestra el total de los créditos que piensas reclamar en el <fg-show path="/taxYear"/>.
    p-e659ce: Este total se basa en la información que llenaste en el estimador sobre tus ingresos, dependientes y los créditos para los que piensas que calificarás.
  modal-why-w-4-step-4-a:
    heading: ¿Por qué se recomienda esto?
    p-837e9a: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este trabajo y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-0909a7: <strong>El paso 4(a)</strong> se utiliza si agregaste otras formas de ingresos tributables en el estimador que no originan de trabajos, pensiones o anualidades.
  modal-why-w-4p-step-4-a:
    heading: ¿Por qué se recomienda esto?
    p-28bdd1: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este pensión o anualidad y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-0909a7: <strong>El paso 4(a)</strong> se utiliza si agregaste otras formas de ingresos tributables en el estimador que no originan de trabajos, pensiones o anualidades.
  modal-why-w-4-step-4-b:
    heading: ¿Por qué se recomienda esto?
    p-837e9a: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este trabajo y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-1bdcd8: <strong>El paso 4(b)</strong> incluyes las deducciones y ajustes que ingresaste en el estimador. Esto puede ayudarte a reducir la cantidad de tus ingresos tributables y del monto que debes retener.
  modal-why-w-4p-step-4-b:
    heading: ¿Por qué se recomienda esto?
    p-28bdd1: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este pensión o anualidad y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-1bdcd8: <strong>El paso 4(b)</strong> incluyes las deducciones y ajustes que ingresaste en el estimador. Esto puede ayudarte a reducir la cantidad de tus ingresos tributables y del monto que debes retener.
  modal-why-w-4-step-4-c:
    heading: ¿Por qué se recomienda esto?
    p-837e9a: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este trabajo y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-fb9379: <strong>El paso 4(c)</strong> se utiliza si necesitas retener más de tus cheques. De lo contrario, puedes dejar esta casilla en blanco.
  modal-why-w-4p-step-4-c:
    heading: ¿Por qué se recomienda esto?
    p-28bdd1: El paso 4 toma en cuenta las diferencias entre los ingresos que recibes de este pensión o anualidad y tus otros ingresos tributables. Las cantidades que ingresas aquí ayudan a ajustar tus retenciones tomando en cuenta esta diferencia.
    p-dd38c7: <strong>El paso 4(c)</strong> se utiliza si necesitas retener más de tus pagos. De lo contrario, puedes dejar esta casilla en blanco.
