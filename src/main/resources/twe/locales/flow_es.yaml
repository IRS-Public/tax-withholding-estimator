/:
  title: Acerca de ti
  h2-5e286b: Acerca de ti
  p-5c8119: Cuéntanos sobre ti. Tus respuestas nos ayudarán a determinar los beneficios tributarios  a los que podrías tener derecho. Esto puede influir en cuánto impuesto se te retiene.
  /primaryFilerAge65OrOlder:
    question: ¿Tendrás 65 años o más para el 1ero de enero del <fg-show path="/nextTaxYear"/>?
  /primaryFilerIsBlind:
    question: ¿Eres ciego(a)?
  /primaryFilerIsClaimingDependents:
    question: ¿Piensas reclamar dependientes en tu declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-claiming-dependents">¿A quién puedo reclamar como dependiente?</modal-link>
  /primaryFilerIsClaimedOnAnotherReturn:
    question: ¿Otra persona podrá reclamarte como dependiente en su declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-primary-claimed-as-dependent">¿Cómo puedo saber si soy dependiente de alguien?</modal-link>
  /filingStatus:
    question: ¿Cuál estado civil usarás para presentar tu declaración del impuesto federal en el <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-filing-status">¿Cuál estado civil debo usar?</modal-link>
    options:
      single:
        name: Soltero(a)
      marriedFilingJointly:
        name: Casado(a) que presenta una declaración conjunta
      marriedFilingSeparately:
        name: Casado(a) que presenta una declaración por separado
      headOfHousehold:
        name: Cabeza de familia
      qualifiedSurvivingSpouse:
        name: Esposo(a) sobreviviente calificado
  /isMFSLivedTogether:
    question: ¿Tú y tu esposo(a) vivirán juntos todo el <fg-show path="/taxYear"/>?
    options:
      'true':
        name: Sí, viviremos juntos todo el año
      'false':
        name: No, no viviremos juntos todo el año
  h3-784c01: Esposo(a)
  p-aedcaf: Si piensas usar el estado civil de Casado que presenta una declaración conjunta, te haremos preguntas adicionales sobre tu esposo(a).
  p-416169: Puedes continuar. No necesitamos hacerte más preguntas porque no usarás el estado civil de Casado que presenta una declaración conjunta.
  /secondaryFilerAge65OrOlder:
    question: ¿Tú y tu esposo(a) vivirán juntos todo el <fg-show path="/nextTaxYear"/>?
  /secondaryFilerIsBlind:
    question: ¿Tu esposo(a) es ciego?
  /secondaryFilerIsClaimedOnAnotherReturn:
    question: ¿Otra persona podrá reclamar a tu esposo(a) como dependiente en su declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-secondary-claimed-as-dependent">¿Cómo saber si mi esposo(a) puede ser un dependiente?</modal-link>
  modal-claiming-dependents:
    heading: ¿A quién puedo reclamar como dependiente?
    p-fc792e: "Los dependientes típicamente son:"
    ul-0:
      li-7673e2: Hijos(as) menores de 19 años
      li-e9750c: Estudiantes menores de 24 años que viven con sus padres
      li-683f65: Parientes o miembros de tu hogar que reciben de ti más de la mitad de sus costos de vida y tienen un sueldo bruto menor de $5,050
    p-6b3acc: No puedes reclamar a tu esposo(a) como tu dependiente si presentan una declaración conjunta.
    p-40e480: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/dependents">Conoce más sobre los dependientes.</a>
  modal-primary-claimed-as-dependent:
    heading: ¿Cómo puedo saber si soy dependiente de alguien?
    p-d3187d: Si dependiste económicamente de otra persona (aparte de tu esposo(a)) en el <fg-show path="/taxYear"/>, podrían tener derecho a reclamarte como dependiente en su declaración del impuesto federal.
    p-762495: "Hay algunas condiciones que determinan si alguien puede reclamarte como dependiente, incluyendo:"
    ul-0:
      li-b17276: Tu relación a esa persona
      li-c82d5e: Cuánto te apoyaron económicamente y de otras formas
      li-5a5073: Si viviste con ellos y por cuánto tiempo
    p-752de3: Revisa la tabla 5 de la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000196863">Publicación 501 del IRS</a> para determinar si alguien puede reclamarte como dependiente.
    p-5a0201: Ten en cuenta que no eres dependiente de otra persona si pagaste por más de la mitad de tus costos de vida (o si lo hizo tu esposo(a)).
  modal-filing-status:
    heading: ¿Cuál estado civil debo usar?
    p-c0b92c: Si no hubo un cambio en tu estado civil o situación familiar este año, podrías usar el estado civil de tu declaración del <fg-show path="/lastTaxYear"/>.
    p-391f95: Si hubo un cambio en tu estado civil o situación familiar en el último año, podrías necesitar usar un estado civil diferente para una estimado más preciso.
    p-496916: Cada estado civil tiene requisitos diferentes.
    p-49f30f: <strong>Soltero(a):</strong>
    ul-0:
      li-c717a5: No puedes estar casado(a)
    p-5f63cd: <strong>Casado que presenta una declaración conjunta:</strong>
    ul-1:
      li-6aab7e: Estás casado(a) o tu esposo(a) falleció durante el año
    p-80c02f: <strong>Casado que presenta una declaración por separado:</strong>
    ul-2:
      li-595e35: Estás casado(a)
      li-1e72dd: No presentarás una declaración con tu esposo(a) (la mayoría de las personas ahorra dinero presentando una declaración conjunta)
    p-d69332: <strong>Cabeza de familia:</strong>
    ul-3:
      li-dfe41a: No puedes estar casado (o no se te considera casado para propósitos de impuestos)
      li-38ff2f: Pagaste más de la mitad del costo de mantener un hogar para un miembro de tu familia o miembro de tu hogar durante un período específico de tiempo y esta persona tiene que cumplir con ciertos requisitos
    p-be481b: <strong>Esposo(a) sobreviviente calificado:</strong>
    ul-4:
      li-2bf38a: Tu esposo(a) falleció en el <fg-show path="/lastTaxYear"/> ó <fg-show path="/taxYearMinusTwo"/>
      li-4ef74f: No te volviste a casar antes del <fg-show path="/taxYear"/>
      li-939762: Tienes un hijo(a) dependiente que vive contigo todo el año
      li-bad5a3: Pagas más de la mitad del costo de mantener tu hogar
    p-b4bd3e: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/filing/filing-status">Conoce más sobre cada estado civil<span class="usa-sr-only"> (abre en una nueva pestaña)</span></a>
  modal-secondary-claimed-as-dependent:
    heading: ¿Cómo saber si mi esposo(a) puede ser un dependiente?
    p-94ceb2: No puedes reclamar a tu esposo(a) como dependiente, aun si dependió de ti económicamente.
    p-f489ed: Si en el <fg-show path="/taxYear"/>, tu esposo(a) dependió de una persona aparte de ti para apoyo, esta otra persona podría reclamar a tu esposo(a) como dependiente en su declaración del impuesto federal.
    p-94a316: "Algunas condiciones determinan si alguien puede reclamar a tu esposo(a) como dependiente, incluyendo:"
    ul-0:
      li-a00f03: La relación de tu esposo(a) con esa persona
      li-06b095: Cuánto apoyaron a tu esposo(a), tanto económicamente y de otras formas
      li-7b9e81: Si tu esposo(a) vivió con ellos y por cuánto tiempo
    p-8725bb: Revisa la tabla 5 de la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000196863">Publicación 501 del IRS</a> para determinar si alguien puede reclamarle como dependiente.
    p-53afc1: Ten en cuenta que tu esposo(a) no califica como dependiente si pagó más de la mitad de sus propios costos de vida, o si los pagaste tú.
