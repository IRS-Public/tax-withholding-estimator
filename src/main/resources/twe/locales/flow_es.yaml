/:
  title: Acerca de ti
  h2-5e286b: Acerca de ti
  p-5c8119: Cuéntanos sobre ti. Tus respuestas nos ayudarán a determinar los beneficios tributarios  a los que podrías tener derecho. Esto puede influir en cuánto impuesto se te retiene.
  /primaryFilerAge65OrOlder:
    question: ¿Tendrás 65 años o más para el 1ero de enero del <fg-show path="/nextTaxYear"/>?
  /primaryFilerIsBlind:
    question: ¿Eres ciego(a)?
  /primaryFilerIsClaimingDependents:
    question: ¿Piensas reclamar dependientes en tu declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-claiming-dependents">¿A quién puedo reclamar como dependiente?</modal-link>
  /primaryFilerIsClaimedOnAnotherReturn:
    question: ¿Otra persona podrá reclamarte como dependiente en su declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-primary-claimed-as-dependent">¿Cómo puedo saber si soy dependiente de alguien?</modal-link>
  /filingStatus:
    question: ¿Cuál estado civil usarás para presentar tu declaración del impuesto federal en el <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-filing-status">¿Cuál estado civil debo usar?</modal-link>
    options:
      single:
        name: Soltero(a)
      marriedFilingJointly:
        name: Casado(a) que presenta una declaración conjunta
      marriedFilingSeparately:
        name: Casado(a) que presenta una declaración por separado
      headOfHousehold:
        name: Cabeza de familia
      qualifiedSurvivingSpouse:
        name: Esposo(a) sobreviviente calificado
  /isMFSLivedTogether:
    question: ¿Tú y tu esposo(a) vivirán juntos todo el <fg-show path="/taxYear"/>?
    options:
      'true':
        name: Sí, viviremos juntos todo el año
      'false':
        name: No, no viviremos juntos todo el año
  h3-784c01: Esposo(a)
  p-aedcaf: Si piensas usar el estado civil de Casado que presenta una declaración conjunta, te haremos preguntas adicionales sobre tu esposo(a).
  p-416169: Puedes continuar. No necesitamos hacerte más preguntas porque no usarás el estado civil de Casado que presenta una declaración conjunta.
  /secondaryFilerAge65OrOlder:
    question: ¿Tú y tu esposo(a) vivirán juntos todo el <fg-show path="/nextTaxYear"/>?
  /secondaryFilerIsBlind:
    question: ¿Tu esposo(a) es ciego?
  /secondaryFilerIsClaimedOnAnotherReturn:
    question: ¿Otra persona podrá reclamar a tu esposo(a) como dependiente en su declaración del <fg-show path="/taxYear"/>?
    modalLink: <modal-link for="modal-secondary-claimed-as-dependent">¿Cómo saber si mi esposo(a) puede ser un dependiente?</modal-link>
  modal-claiming-dependents:
    heading: ¿A quién puedo reclamar como dependiente?
    p-fc792e: "Los dependientes típicamente son:"
    ul-0:
      li-7673e2: Hijos(as) menores de 19 años
      li-e9750c: Estudiantes menores de 24 años que viven con sus padres
      li-683f65: Parientes o miembros de tu hogar que reciben de ti más de la mitad de sus costos de vida y tienen un sueldo bruto menor de $5,050
    p-6b3acc: No puedes reclamar a tu esposo(a) como tu dependiente si presentan una declaración conjunta.
    p-40e480: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/dependents">Conoce más sobre los dependientes.</a>
  modal-primary-claimed-as-dependent:
    heading: ¿Cómo puedo saber si soy dependiente de alguien?
    p-d3187d: Si dependiste económicamente de otra persona (aparte de tu esposo(a)) en el <fg-show path="/taxYear"/>, podrían tener derecho a reclamarte como dependiente en su declaración del impuesto federal.
    p-762495: "Hay algunas condiciones que determinan si alguien puede reclamarte como dependiente, incluyendo:"
    ul-0:
      li-b17276: Tu relación a esa persona
      li-c82d5e: Cuánto te apoyaron económicamente y de otras formas
      li-5a5073: Si viviste con ellos y por cuánto tiempo
    p-752de3: Revisa la tabla 5 de la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000196863">Publicación 501 del IRS</a> para determinar si alguien puede reclamarte como dependiente.
    p-5a0201: Ten en cuenta que no eres dependiente de otra persona si pagaste por más de la mitad de tus costos de vida (o si lo hizo tu esposo(a)).
  modal-filing-status:
    heading: ¿Cuál estado civil debo usar?
    p-c0b92c: Si no hubo un cambio en tu estado civil o situación familiar este año, podrías usar el estado civil de tu declaración del <fg-show path="/lastTaxYear"/>.
    p-391f95: Si hubo un cambio en tu estado civil o situación familiar en el último año, podrías necesitar usar un estado civil diferente para una estimado más preciso.
    p-496916: Cada estado civil tiene requisitos diferentes.
    p-49f30f: <strong>Soltero(a):</strong>
    ul-0:
      li-c717a5: No puedes estar casado(a)
    p-5f63cd: <strong>Casado que presenta una declaración conjunta:</strong>
    ul-1:
      li-6aab7e: Estás casado(a) o tu esposo(a) falleció durante el año
    p-80c02f: <strong>Casado que presenta una declaración por separado:</strong>
    ul-2:
      li-595e35: Estás casado(a)
      li-1e72dd: No presentarás una declaración con tu esposo(a) (la mayoría de las personas ahorra dinero presentando una declaración conjunta)
    p-d69332: <strong>Cabeza de familia:</strong>
    ul-3:
      li-dfe41a: No puedes estar casado (o no se te considera casado para propósitos de impuestos)
      li-38ff2f: Pagaste más de la mitad del costo de mantener un hogar para un miembro de tu familia o miembro de tu hogar durante un período específico de tiempo y esta persona tiene que cumplir con ciertos requisitos
    p-be481b: <strong>Esposo(a) sobreviviente calificado:</strong>
    ul-4:
      li-2bf38a: Tu esposo(a) falleció en el <fg-show path="/lastTaxYear"/> ó <fg-show path="/taxYearMinusTwo"/>
      li-4ef74f: No te volviste a casar antes del <fg-show path="/taxYear"/>
      li-939762: Tienes un hijo(a) dependiente que vive contigo todo el año
      li-bad5a3: Pagas más de la mitad del costo de mantener tu hogar
    p-b4bd3e: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/filing/filing-status">Conoce más sobre cada estado civil<span class="usa-sr-only"> (abre en una nueva pestaña)</span></a>
  modal-secondary-claimed-as-dependent:
    heading: ¿Cómo saber si mi esposo(a) puede ser un dependiente?
    p-94ceb2: No puedes reclamar a tu esposo(a) como dependiente, aun si dependió de ti económicamente.
    p-f489ed: Si en el <fg-show path="/taxYear"/>, tu esposo(a) dependió de una persona aparte de ti para apoyo, esta otra persona podría reclamar a tu esposo(a) como dependiente en su declaración del impuesto federal.
    p-94a316: "Algunas condiciones determinan si alguien puede reclamar a tu esposo(a) como dependiente, incluyendo:"
    ul-0:
      li-a00f03: La relación de tu esposo(a) con esa persona
      li-06b095: Cuánto apoyaron a tu esposo(a), tanto económicamente y de otras formas
      li-7b9e81: Si tu esposo(a) vivió con ellos y por cuánto tiempo
    p-8725bb: Revisa la tabla 5 de la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000196863">Publicación 501 del IRS</a> para determinar si alguien puede reclamarle como dependiente.
    p-53afc1: Ten en cuenta que tu esposo(a) no califica como dependiente si pagó más de la mitad de sus propios costos de vida, o si los pagaste tú.
/income:
  title: Ingresos y pagos de impuestos
  h2-fdf8c2: Ingresos y pagos de impuestos del <fg-show path="/taxYear"/>
  p-ed5944: Indica el ingreso total, retención del impuesto federal y pagos de impuestos estimados que <span condition="/isFilingStatusMFJ" operator="isTrue">tú y tu esposo(a) esperan</span><span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span> en el <fg-show path="/taxYear"/>.
  p-389582: Para usar este estimador necesitas tener ingresos de un trabajo, pensión, o anualidad.
  h3-39ed29: Trabajos con un empleador (W-2)
  fg-alert-eadda7:
    heading: <span condition="/isFilingStatusMFJ" operator="isFalse">Debes</span><span condition="/isFilingStatusMFJ" operator="isTrue">Tu o tu esposo(a) deben</span> tener por lo menos un trabajo, pensión o anualidad que regularmente retenga impuesto federal.
    p-d4a8fe: Agrega un trabajo, pensión o anualidad para seguir usando el estimador. Si no tienes un trabajo, pensión o anualidad que retenga impuesto federal, podrías planificar pagar <a target="_blank"
      href="https://www.irs.gov/es/businesses/small-businesses-self-employed/estimated-taxes"
      class="usa-link">impuestos estimados. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  p-0ec9f9: <modal-link for="modal-what-counts-job">¿Qué cuenta como un trabajo?</modal-link>
  collection/jobs:
    /jobs/*/filerAssignment:
      question: ¿Quién recibe estos ingresos?
      options:
        self:
          name: Yo
        spouse:
          name: Mi esposo(a)
    /jobs/*/isHourlyJob:
      question: ¿Este trabajo paga por hora o paga un salario?
      options:
        'true':
          name: Por hora (la paga cambia según la cantidad de horas que trabajaste)
        'false':
          name: Salario (la paga es casi igual en cada periodo de pago)
    h5-d3b69e: Duración
    /jobs/*/isAllYear:
      question: <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">¿Espera</span>
                    <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">¿Esperas</span>
                    <span condition="/jobs/*/isFilerAssignmentSelf" operator="isIncomplete">¿Esperas</span> tener este trabajo todo el año o solo parte del año?
      options:
        'true':
          name: Todo el año (1 de enero al 31 de diciembre del <fg-show path="/taxYear"/>)
        'false':
          name: Parte del año
    /jobs/*/writableStartDate:
      question: ¿Cuál es el primer día del <fg-show path="/taxYear"/> en el que <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">espera</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">esperas</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isIncomplete">esperas</span> tener este trabajo?
      hint: Puedes estimar la fecha.
    /jobs/*/writableEndDate:
      question: ¿Cuál es el último día del <fg-show path="/taxYear"/> que <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">espera</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">esperas</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isIncomplete">esperas</span> tener este trabajo?
      hint: Puedes estimar la fecha.
    /jobs/*/payFrequency:
      question: ¿Con qué frecuencia <span condition="/jobs/*/isInFuture" operator="isFalse">le</span><span condition="/jobs/*/isInFuture" operator="isTrue">espera</span> <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">que te</span><span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">que le</span><span condition="/jobs/*/isInFuture" operator="isTrue"> paguen</span><span condition="/jobs/*/isInFuture" operator="isFalse"> pagan</span>?
      modalLink: <modal-link for="modal-pay-frequency">Conoce más sobre la frecuencia de pago.</modal-link>
      options:
        weekly:
          name: Semanal
        biWeekly:
          name: Cada dos semanas
        semiMonthly:
          name: Dos veces al mes
        monthly:
          name: Una vez al mes
    h5-4f6501: Detalles
    p-216488: Te haremos preguntas adicionales cuando sepamos más sobre tus ingresos.
    h5-bee04a: Fechas e ingresos
    h5-715b08: Ingresos esperados
    p-0ae3e5: Usa el cheque más reciente del <fg-show path="/taxYear"/> para llenar la siguiente información.
    /jobs/*/hoursPerPayPeriod:
      question: |-
        Cuántas horas
          <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">esperas</span>
          <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">espera</span>
          trabajar en cada periodo de pago?
      hint: Puedes estimar la cantidad.
    /jobs/*/expectedFutureAnnualSalary:
      question: |-
        ¿Cuánto <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">esperas</span>
                <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">espera</span>
                que sea tu salario anual?
      hint: Ingresa la cantidad entera. Calcularemos la parte proporcional del año por ti. No incluyas propinas o pagos por horas extra.
    /jobs/*/expectedFuturePayPerHour:
      question: |-
        ¿Cuánto <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">esperas</span>
                <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">espera</span>
                recibir en pago por hora?
      hint: No incluyas pago por horas extra.
    /jobs/*/mostRecentPayDate:
      question: |-
        ¿Cuándo fue
          <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">tu</span>
          <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">su</span>
          fecha de pago más reciente del <fg-show path="/taxYear"/>?
    /jobs/*/mostRecentPayPeriodEnd:
      question: ¿Cuándo terminó el periodo de pago más reciente del <fg-show path="/taxYear"/>?
      modalLink: <modal-link for="modal-job-pay-dates">¿Cómo encuentro la fecha del periodo de pago y la fecha de pago?</modal-link>
    /jobs/*/consistentPay:
      question: ¿Qué tan parecido es el monto de pago de cada cheque?
      options:
        'true':
          name:  El pago es casi igual en cada cheque
        'false':
          name: El pago es muy diferente cada cheque
    /jobs/*/amountLastPaycheck:
      question: ¿Cuál es el ingreso bruto en este periodo de pago?
      hint: Esto incluye bonos, propinas y pago por horas extra.
      modalLink: <modal-link for="modal-job-gross-pay-period">¿Qué significa ingreso bruto por periodo de pago y dónde puedo encontrarlo?</modal-link>
    p-853eac: Como la paga es muy diferente en cada cheque, usaremos dos o tres de los talones de cheque más recientes para obtener un promedio.
    /jobs/*/pastPaycheckIncome1:
      question: En el último talón de cheque del <fg-show path="/taxYear"/>, ¿cuál es el ingreso bruto por periodo de pago?
      hint: Esto incluye bonos, propinas y pago por horas extra.
      modalLink: <modal-link for="modal-job-gross-pay-period">¿Cómo puedo encontrar el ingreso bruto por periodo de pago?</modal-link>
    /jobs/*/pastPaycheckIncome2:
      question:  En el penúltimo talón de cheque, ¿cuál es el ingreso bruto por periodo de pago?
    /jobs/*/pastPaycheckIncome3:
      question: En el antepenúltimo talón de cheque, ¿cuál es el ingreso bruto por periodo de pago?
      hint: Si no tienes un tercer talón de cheque, puedes dejar esta casilla en blanco.
    /jobs/*/mostRecentPayPeriodHasBonus:
      question: <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">¿Recibió</span>
                      <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">¿Recibiste</span> un bono en <span condition="/jobs/*/consistentPay" operator="isTrue">este periodo</span>
                      <span condition="/jobs/*/consistentPay" operator="isFalse">estos periodos</span>
      modalLink: <modal-link for="modal-job-check-bonus">¿Cómo puedo revisar si recibí un bono en este periodo de pago?</modal-link>
      options:
        'true':
          name: Sí, hay un bono en <span condition="/jobs/*/consistentPay" operator="isTrue">este periodo</span>
                            <span condition="/jobs/*/consistentPay" operator="isFalse">estos periodos</span>
        'false':
          name: No, <span condition="/jobs/*/consistentPay" operator="isTrue">este periodo</span>
                            <span condition="/jobs/*/consistentPay" operator="isFalse">estos periodos</span> de pago sólo <span condition="/jobs/*/consistentPay" operator="isTrue">tiene</span>
                            <span condition="/jobs/*/consistentPay" operator="isFalse">tienen</span> el sueldo normal
    /jobs/*/mostRecentPayPeriodBonusAmount:
      question: |-
        ¿Cuánto <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">recibió</span>
                <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">recibiste</span>
                en
                <span condition="/jobs/*/consistentPay" operator="isTrue">este periodo</span>
                <span condition="/jobs/*/consistentPay" operator="isFalse">estos periodos</span>
                de pago?
    /jobs/*/totalFutureBonus:
      question: <span condition="/jobs/*/isInFuture" operator="isTrue">Bonos que <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">esperas</span><span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">espera</span> ganar en el <fg-show path="/taxYear"/></span><span condition="/jobs/*/isInFuture" operator="isFalse">Estima el monto de los bonos que <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">piensas</span><span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">piensa</span> que <span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isFalse">recibirá</span><span condition="/jobs/*/isFilerAssignmentSelfOrIncomplete" operator="isTrue">recibirás</span> durante el resto del <fg-show path="/taxYear"/></span>
      hint: <span condition="/jobs/*/isInFuture" operator="isTrue">Puedes estimarlo o dejarlo en blanco.</span><span condition="/jobs/*/isInFuture" operator="isFalse">Si no lo sabes, puedes dejarlo en blanco.</span>
      modalLink: <modal-link for="modal-estimate-future-bonus"><span condition="/jobs/*/isInFuture" operator="isTrue">¿Qué cuenta como bono?</span><span condition="/jobs/*/isInFuture" operator="isFalse">¿Cómo puedo estimar bonos futuros?</span></modal-link>
    p-07e933: '<strong>Ingresos estimados del <fg-show path="/taxYear"/>: <fg-show path="/jobs/*/expectedFutureIncome"/></strong>'
    p-372bcf: Si el monto parece incorrecto, revisa las respuestas anteriores
    /jobs/*/yearToDateIncome:
      question: ¿Cuánto <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">ha</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">has</span> recibido en ingreso bruto en lo que va del <fg-show path="/taxYear"/>?
      hint: Esto puede llamarse “year-to-date“ o “YTD“ en tu talón de cheque. Incluye bonos, propinas, y pago por tiempo extra.
      modalLink: <modal-link for="modal-job-gross-ytd-end">¿Cómo puedo encontrar el ingreso bruto en lo que va del <fg-show path="/taxYear"/>?</modal-link>
    h5-64d83a: Propinas y horas extra estimadas
    p-902fc0: Existen nuevas deducciones para propinas y horas extra desde el año 2025 al 2028. Si cumples con los requisitos para ser elegible, <span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isFalse">podría</span><span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isTrue">podrías</span> deducir (restar) de <span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isFalse">su</span><span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isTrue">tu</span> sueldo las propinas y tiempo extra calificados.
    p-089a35: Si esta sección no <span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isFalse">le</span><span condition="/jobs/*/isFilerAssignmentSelf"
        operator="isTrue">te</span> aplica, puedes dejarla en blanco.
    fg-detail-bbdbfc:
      summary: Propinas estimadas
      p-c3c8eb: Las propinas son pagos voluntarios en efectivo o crédito recibidos de clientes o arreglos para compartir propinas.
      p-d353b7: <a target="_blank" href="https://www.irs.gov/newsroom/one-big-beautiful-bill-act-tax-deductions-for-working-americans-and-seniors">Conoce más sobre la deducción de propinas.</a>
      p-9a0b89: Para ser elegible para la deducción de propinas, <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">tu esposo(a) debe</span>
                      <span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">debes</span> tener un <a target="_blank" href="https://www.irs.gov/forms-pubs/occupations-that-customarily-and-regularly-received-tips-on-or-before-december-31-2024">trabajo</a> que el IRS reconozca como un trabajo que recibe propinas regularmente.
      /jobs/*/qualifiedTipIncome:
        question: Total de propinas estimadas para el <fg-show path="/taxYear"/>
        hint: Puedes dejar esta casilla en blanco si no <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">tiene</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">tienes</span> un número de Seguro Social.
        modalLink: <modal-link for="modal-estimate-tips">¿Cómo puedo estimar propinas?</modal-link>
      /jobs/*/eligibleForNoTaxOnTips:
        question: No soy elegible para la deducción “no impuestos sobre propinas”
        modalLink: <modal-link for="modal-no-tax-on-tips">¿Cómo saber si soy elegible para la deducción de “no impuestos sobre propinas”?</modal-link>
    fg-detail-de7b9c:
      summary: Horas extra estimadas
      p-bc05b9: Las horas extra son un pago adicional que recibes por trabajar más de 40 horas por semana. Solo incluye el tiempo extra que tu empleador tiene requerido pagarte bajo la Ley de Normas Justas de Trabajo (FLSA).
      p-1c212b: <a target="_blank" href="https://www.irs.gov/es/forms-pubs/how-to-update-withholding-to-account-for-tax-law-changes-for-2025">Conoce más sobre la deducción por horas extra.</a>
      /jobs/*/overtimeCompensationTotal:
        question: Total de pago estimado por horas extra en el <fg-show path="/taxYear"/>
        hint: Puedes dejar esta casilla en blanco si no <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">tiene</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">tienes</span> un número de Seguro Social.
        modalLink: <modal-link for="modal-estimate-overtime">¿Cómo puedo estimar las horas extra?</modal-link>
      /jobs/*/eligibleForNoTaxOnOvertime:
        question: No soy elegible para la deducción “no impuestos sobre horas extra”
        modalLink: <modal-link for="modal-no-tax-on-overtime">¿Cómo saber si soy elegible para la deducción de “no impuestos sobre horas extra”?</modal-link>
      /jobs/*/overtimeCompensationRate:
        question: ¿Cuánto te pagan por horas extra?
        modalLink: <modal-link for="modal-estimate-overtime-rate">¿Qué pasa si me pagan una tarifa por horas extra?</modal-link>
        options:
          onePointFive:
            name: 1.5 veces mi paga regular
          two:
            name: 2.0 veces mi paga regular
    h5-9f886e: Impuesto federal
    p-6f0cc9: Usa el talón de cheque más reciente para ingresar la siguiente información.
    /jobs/*/amountWithheldLastPaycheck:
      question: Impuesto federal retenido (pagado) en este periodo de pago
      hint: No incluyas impuestos estatales, locales, Medicare o Seguro Social.
      modalLink: <modal-link for="modal-fed-tax-pay-period">
                      ¿Cómo puedo encontrar el impuesto federal retenido por periodo de pago?
                    </modal-link>
    /jobs/*/yearToDateWithholding:
      question: Impuesto federal retenido (pagado) en lo que va del <fg-show path="/taxYear"/>
      hint: Podría llamarse año hasta la fecha (year-to-date) o YTD en tu talón de cheque. No incluyas impuestos estatales o locales, Medicare o Seguro Social.
      modalLink: <modal-link for="modal-fed-tax-ytd"> ¿Cómo puedo encontrar el impuesto federal retenido en lo que va del <fg-show path="/taxYear"/>? </modal-link>
    h5-4504e1: Contribuciones
    p-1c3f63: Consulta <span condition="/jobs/*/isFilerAssignmentSelf" operator="isFalse">su</span><span condition="/jobs/*/isFilerAssignmentSelf" operator="isTrue">tu</span> talón de cheque para conocer las contribuciones pre-impuestos (también las llaman "payroll deductions") que ayudan a pagar por beneficios.
