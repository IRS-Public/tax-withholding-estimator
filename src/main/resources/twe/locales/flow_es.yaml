        operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ"
        operator="isTrue">esperan</span> recibir en el <fg-show path="/taxYear"/>
  fg-detail-b186f4:
    summary: Ingresos pasivos o activos de corporaciones S o asociaciones
    p-b595ad: Ingresa los montos totales que esperas ganar en el <fg-show path="/taxYear"/>.
    p-95e1b7: <modal-link for="modal-estimate-s-corp-partnership-income">¿Cómo puedo estimar ingresos de corporaciones S o asociaciones?</modal-link>
    /sCorpPassiveIncome:
      question: Ingresos pasivos de corporaciones S o asociaciones que <span condition="/isFilingStatusMFJ"
        operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ"
        operator="isTrue">esperan</span> recibir en el <fg-show path="/taxYear"/>
    /sCorpNonPassiveIncome:
