  h3-95eb01: Otros ingresos tributables no incluidos anteriormente
  p-67f0cb: 'Estima cualquier otro ingreso tributable que piensas <span condition="/isFilingStatusMFJ"
        operator="isFalse">recibir</span><span condition="/isFilingStatusMFJ"
        operator="isTrue">que tú o tu esposo(a) recibirán</span> en el <fg-show path="/taxYear"/>, incluyendo:'
  ul-0:
    li-6c1f6e: Becas tributables
    li-b9815d: Ganancias por juegos de azar
    li-98533d: Pensión conyugal por decretos de divorcio pre-2019
    li-2ce899: Compensaciones y daños y perjuicios otorgados por una corte (a menos que sean por lesiones físicas o enfermedad)
    li-bd02e0: Honorarios por servicios que proporcionaste
  p-48332b: <a target="_blank" href="https://www.irs.gov/es/filing/taxable-income" class="usa-link
    usa-link--external">Conoce más sobre otros ingresos tributables.<span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /nonSpecificOtherIncome:
    question: Total de otros ingresos que <span condition="/isFilingStatusMFJ"
        operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ"
        operator="isTrue">esperan</span> recibir en el <fg-show path="/taxYear"/>
    hint: Escribe una cantidad total para todos los otros ingresos.
  /otherIncomeWithholding:
    question: Impuesto federal retenido de <span condition="/isFilingStatusMFJ"
        operator="isFalse">tus</span> otros ingresos <span condition="/isFilingStatusMFJ"
        operator="isTrue">tuyos y de tu esposo(a)</span> en lo que va del <fg-show path="/taxYear"/>
    hint: Si no estás seguro, deja la casilla en blanco.
  h3-536be3: Impuestos estimados pagados
  p-67bec4: Además del impuesto ya retenido de tus ingresos, los pagos estimados se hacen directamente al IRS, usualmente a través de tu cuenta en línea del IRS o con el Formulario 1040-ES.
  p-8f958a: <a target="_blank" href="https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes"
    class="usa-link usa-link--external">Conoce más sobre los pagos estimados.<span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /totalEstimatedTaxesPaid:
    question: Pagos de impuestos estimados que <span condition="/isFilingStatusMFJ"
        operator="isFalse">hiciste</span><span condition="/isFilingStatusMFJ"
        operator="isTrue">hicieron</span> en lo que va del <fg-show path="/taxYear"/>
    hint: No incluyas impuestos retenidos de tus cheques de sueldo y otros ingresos.
  modal-pay-frequency:
    heading: Conoce más sobre la frecuencia de pago
    p-f8e48f: La frecuencia de pago es qué tan seguido una persona recibe pagos de su empleador o pensión.
    ul-0:
      li-ae23d7: <strong>Semanal:</strong> Se le paga una vez por semana.
      li-9e775f: <strong>Cada dos semanas:</strong> Se le paga una semana sí y otra no. Recibe dos o tres pagos al mes.
      li-569d8d: <strong>Dos veces al mes:</strong> Siempre se le paga dos veces al mes o en ciertas fechas. Por ejemplo, los días 1 y 15 de cada mes.
      li-fdcbf1: <strong>Una vez al mes:</strong> Se le paga una vez por mes.
    p-8ef9ed: Si la frecuencia de tus pagos no coincide con alguna de estas opciones, elige la opción más parecida y ajusta el monto de tu pago según tu elección.
  modal-job-bonus-pay:
    heading: "<span condition=\"/jobs/*/isInFuture\" operator=\"isTrue\"\
      >¿Qué cuenta como un bono?</span><span condition=\"/jobs/*/isInFuture\" operator=\"isFalse\">¿Qué cuenta como un bono y cómo puedo incluirlo?</span>"
    p-185c7d: Usualmente, los bonos son un pago único y adicional a tu salario regular.
    p-74fc7e: Si esperas recibir un bono de tu empleador a fin de año o fin de trimestre, incluye esa cantidad.
    p-89cc04: Está bien incluir una idea del monto que recibirás. También puedes dejar la casilla de bonos futuros en blanco.
  modal-job-pay-dates:
    heading: ¿Dónde encuentro el período de pago y la fecha de pago?
    p-8b4b93: Puedes encontrar el periodo de pago y la fecha de pago en el talón de cheque, el documento que acompaña el cheque e incluye los detalles del pago.
    ul-0:
      li-8a677f: '<strong>Periodo de pago:</strong> Los días que trabajaste y por los que se te está pagando. A menudo indica una fecha de comienzo (start date) y la fecha del último día trabajado (end date).'
      li-1b998e: '<strong>Fecha de pago:</strong> El día que se emite o fecha el cheque de pago.'
  modal-job-gross-pay-period:
    heading: ¿Cómo puedo encontrar el ingreso bruto por periodo de pago?
    p-86ad55: El ingreso bruto por periodo de pago es el total que te pagan por las fechas indicadas en el cheque antes de retener impuestos o quitar deducciones.
    p-a88bb0: Si hay un pago adicional como un bono, propinas o pago por horas extra, también se incluirá en la cantidad de ingreso bruto.
    p-654d7e: <strong>Dónde encontrarlo</strong>
    p-22c78c: Revisa el talón de cheque por el <strong>monto bruto por periodo de pago.</strong> Este sólo incluye el pago por los días que trabajaste por este cheque.
  modal-no-tax-on-tips:
    heading: ¿Cómo saber si soy elegible para la deducción de “no impuestos sobre propinas”?
    p-71332d: 'Para ser elegible para la deducción de “no impuestos sobre propinas” debes:'
    ul-0:
      li-a567e2: tener un trabajo que el IRS reconozca como un trabajo que recibe propinas regularmente
      li-830c05: tener un número de Seguro Social
    p-d2cd93: Si es difícil estimar el monto, puedes dejar la casilla en blanco.
    p-7abc41: <a href="https://www.irs.gov/businesses/small-businesses-self-employed/tips" target="_blank" class="usa-link usa-link--external">Conoce más sobre la deducción de no impuestos sobre propinas.<span class="usa-sr-only"/></a>
  modal-no-tax-on-overtime:
    heading: ¿Cómo saber si soy elegible para la deducción de “no impuestos sobre horas extra”?
    p-840df1: 'Para ser elegible para la deducción de “no impuestos sobre horas extra”:'
    ul-0:
      li-b0b373: el empleador debe tener requerido pagarte bajo la ley de Estándares de trabajo justo (Fair Labor Standard Act, FLSA)
      li-89acc4: debes ganar paga por horas extra trabajando más de 40 horas a la semana
      li-a567e2: debes tener un número de Seguro Social
    p-f57b74: El pago por horas extra no se require bajo la sección 7 del FLSA (por ejemplo, por ley estatal o contrato de un sindicato), no es deducible y no debe ingresarse en el estimado.
    p-88d0b8: <a href="https://www.irs.gov/es/forms-pubs/how-to-update-withholding-to-account-for-tax-law-changes-for-2025"
      target="_blank" class="usa-link usa-link--external">Conoce más sobre la deducción de no impuestos sobre horas extra.<span class="usa-sr-only"/></a>
  modal-what-counts-social-security:
    heading: ¿Qué cuenta como ingresos de Seguro Social?
    p-00bbe8: Los ingresos de Seguro Social son pagos para jubilados, personas con discapacidades y sus familias a través de la Administración de Seguro Social (SSA). Para reportar estos ingresos a fin de año, la SSA enviará el Formulario SSA-1099.
    p-39e713: <strong>No incluyas</strong> pagos de Seguridad de Ingreso Suplementario (SSI). Este estimador aún no acepta pagos de SSI.
  modal-fed-tax-social-security-pay-period:
    heading: ¿Qué significa monto mensual de beneficio y dónde lo encuentro?
    p-82e34c: El monto mensual del beneficio es el total que recibes del Seguro Social cada mes <strong>antes de</strong> descontar primas de Medicare, impuestos u otras deducciones.
    p-716710: 'Puedes estimar la cantidad, pero para encontrar la cantidad exacta:'
    ol-0:
      li-ea5ad7: Ingresa a tu <a target="_blank" href="https://www.ssa.gov/myaccount/"
        class="usa-link">cuenta de my Social Security<span class="usa-sr-only"/></a>
      li-5b74be: Navega a la sección de <strong>Beneficios y Pagos</strong> (Benefits and Payments)
      li-53a1fa: Encontrarás el total del beneficio mensual antes de deducciones en el resumen de <strong>Beneficios</strong>
    p-b74063: Si necesitas ayuda para encontrar el monto del beneficio mensual, puedes llamar a la Administración del Seguro Social al 1-800-772-1213.
  modal-fed-social-security-tax-withheld:
    heading: ¿Cómo puedo saber si me retienen impuestos?
    p-1a87a7: La Administración del Seguro Social no retiene impuestos de tus ingresos por Seguro Social de forma automática.
    p-a147e9: Puedes solicitar que retengan el impuesto federal de tus ingresos por Seguro Social.
    p-88d383: 'Para revisar si retienen impuesto federal de tus ingresos por Seguro Social:'
    ol-0:
      li-ea5ad7: Ingresa a tu <a target="_blank" href="https://www.ssa.gov/myaccount/"
        class="usa-link">cuenta de my Social Security (en inglés)<span class="usa-sr-only"/></a>
      li-ae75a0: Elige <strong>Retención voluntaria de impuestos</strong> (Voluntary Tax Withholding) para conocer el porcentaje que se retiene
    p-2f6487: Si no solicitaste que te retengan impuestos, el porcentaje será 0%.
    p-c1b4cc: Si no tienes una cuenta en línea o necesitas ayuda para revisar tu retención del impuesto federal, puedes llamar a la Administración del Seguro Social al 1-800-772-1213.
  modal-what-counts-job:
    heading: ¿Qué cuenta como un trabajo?
    p-cc1a45: Un trabajo es cuando recibes ingresos por trabajar para un empleador. A fin de año, el empleador te enviará un Formulario W-2 para reportar estos ingresos.
    p-fcadfe: '<strong>No incluyas</strong> ingresos que recibiste a través de:'
    ul-0:
      li-ad6e01: Una sociedad, comercio o negocio que es tuyo
      li-78d8a9: Trabajos, servicios, o bienes a pedido como trabajador independiente, contratista, o trabajador por encargo
    p-8bf756: Agrega estos ingresos en la sección de <strong>Ingresos de trabajo por cuenta propia</strong>.
  modal-what-counts-pension:
    heading: ¿Qué cuenta como una pensión o anualidad?
    p-131b40: Una pensión es, por lo general, una serie de pagos determinados que se hacen luego de tu jubilación. Los pagos de pensión se hacen de forma regular y se basan en factores como años de servicio y salarios anteriores.
    p-acdc8a: Una anualidad es una serie de pagos bajo contrato que se hacen en intérvalos regularles por un tiempo mayor a un año.
    p-8ef182: Al final del año, el proveedor de la pensión o anualidad te enviará el Formulario 1099-R para reportar tus ingresos.
    p-c74e46: <strong>No incluyas</strong> distribuciones o retiros de planes 401(k), 403(b) o 457(b), o de un plan de jubilación individual (IRA). Agrega estos ingresos en la sección “Ingresos por cuentas de jubilación pre-impuestos”
  modal-pension-gross-pay-period:
    heading: ¿Cómo puedo encontrar el ingreso bruto en el pago más reciente?
    p-fef4bf: Este es el total de tu último pago de pensión o anualidad antes que se le apliquen impuestos o deducciones.
    p-c19981: Revisa el monto del pago bruto <strong>en tu estado de cuenta más reciente</strong>.
    p-0f1994: 'Si el monto anual de tu pensión o anualidad será el mismo que el año pasado, también puedes revisar el Formulario 1099-R del <fg-show path="/lastTaxYear"/>. Para estimar el monto bruto de tu pago más reciente:'
    ol-0:
      li-8cda67: Encuentra la casilla 1 en el Formulario 1099-R. Este muestra el ingreso bruto de todo el año pasado
      li-88cea7: Divide el monto bruto del año pasado entre el número de pagos que esperas recibir en el <fg-show path="/taxYear"/>
  modal-pension-gross-ytd-end:
    heading: ¿Cómo puedo encontrar el ingreso bruto recibido en lo que va del <fg-show path="/taxYear"/>?
    p-1f18fb: El ingreso bruto es el monto total que se te pagó antes de restarle impuestos o deducciones.
    p-818dfb: Busca el ingreso bruto en lo que va del año <strong>en tu estado de cuenta más reciente.</strong> Podría llamarse ingreso bruto este año hasta la fecha (year-to-date) o YTD.
    p-83d213: <strong>Si no tienes un estado de cuenta,</strong> pero conoces el monto bruto por pago, puedes hacer un estimado multiplicando el monto bruto de un pago por el número de pagos que has recibido en lo que va del <fg-show path="/taxYear"/>.
    p-9475e2: 'Si el monto anual de tu pensión o anualidad será el mismo que el año pasado, puedes revisar el Formulario 1099-R del <fg-show path="/lastTaxYear"/>. Para estimar el ingreso bruto en lo que va del año:'
    ol-0:
      li-8cda67: Encuentra la casilla 1 en el Formulario 1099-R. Este muestra el ingreso bruto de todo el año pasado
      li-88cea7: Divide el monto bruto del año pasado entre el número de pagos que esperas recibir en el <fg-show path="/taxYear"/>
      li-8ed353: Luego, multiplica el resultado por el número de pagos que has recibido en lo que va del <fg-show path="/taxYear"/>
  modal-fed-tax-pension-pay-period:
    heading: ¿Cómo puedo encontrar el impuesto federal retenido en el pago más reciente?
    p-eb3a66: Este monto se retiene del pago de tu pensión o anualidad para cubrir el impuesto federal.
    p-6b6de8: Busca el impuesto federal retenido de cada pago <strong>en tu estado de cuenta más reciente.</strong>
    ul-0:
      li-b14438: Podría aparecer en una sola línea llamada Impuestos, FIT, FITW, FITC, Fed W/H, Fed tax, Fed withholding, Federal income tax o algo similar
      li-16154b: Si pediste retener una cantidad adicional para el impuesto federal, ese monto podría aparecer en una línea separada. Asegúrate de sumar ambas cantidades
    p-1754a4: 'Si el monto anual de tu pensión o anualidad será igual al monto del año pasado, puedes usar el Formulario 1099-R del <fg-show path="/lastTaxYear"/> como referencia. Para estimar cuánto impuesto federal se retuvo del pago mas reciente:'
    ol-0:
      li-62615d: Busca la casilla 4 en el Formulario 1099-R. Esta indica el impuesto federal retenido el año pasado
      li-71dfdf: Divide el monto retenido el año pasado entre el número de pagos que esperas recibir en el <fg-show path="/taxYear"/>
    p-d6e23c: <strong>No incluyas</strong> impuestos estatales y locales, Medicare, Seguro Social u otras cantidades retenidas.
  modal-fed-pension-tax-ytd:
    heading: ¿Cómo puedo encontrar el impuesto federal retenido en lo que va del <fg-show path="/taxYear"/>?
    p-737d99: Este monto se retiene del pago de tu pensión o anualidad para cubrir el impuesto federal a lo largo del año.
    p-29415d: Busca el impuesto federal pagado en lo que va del año <strong>en tu estado de cuenta más reciente.</strong> Podría llamarse impuesto federal retenido este año hasta la fecha (year-to-date) o YTD.
    ul-0:
      li-b14438: Podría aparecer en una sola línea llamada Impuestos, FIT, FITW, FITC, Fed W/H, Fed tax, Fed withholding, Federal income tax o algo similar
      li-16154b: Si pediste retener una cantidad adicional para el impuesto federal, ese monto podría aparecer en una línea separada. Asegúrate de sumar ambas cantidades
    p-e5ca13: 'Si el monto anual de tu pensión o anualidad será igual al monto del año pasado, puedes usar el Formulario 1099-R del <fg-show path="/lastTaxYear"/> como referencia. Para estimar cuánto impuesto federal se retuvo hasta la fecha:'
    ol-0:
      li-5b0ddc: Busca la casilla 4 en el Formulario 1099-R. Esta indica el impuesto federal retenido el año pasado
      li-71dfdf: Divide el monto retenido el año pasado entre el número de pagos que esperas recibir en el <fg-show path="/taxYear"/>
      li-8ed353: Luego, multiplica el resultado por el número de pagos que has recibido en lo que va del <fg-show path="/taxYear"/>
    p-d6e23c: <strong>No incluyas</strong> impuestos estatales y locales, Medicare, Seguro Social u otras cantidades retenidas.
  modal-what-counts-self-employment:
    heading: ¿Qué cuenta como un trabajo por cuenta propia?
    p-fd0d43: Los ingresos de trabajo por cuenta propia se ganan a través de una sociedad, comercio o negocio que sea tuyo. También puedes ganarlos al brindar servicios o bienes a pedido como trabajador independiente, contratista, o trabajador por encargo.
    p-07a211: Para reportar estos ingresos a fin de año, el pagador (la persona, negocio y organización que te pagó) te enviará un Formulario 1099-NEC, Formulario 1099-K o el Formulario 1099-MISC.
    p-089c0d: <strong>No incluyas</strong> ingresos que hayas recibido al trabajar para un empleador. Si el pagador te envía un Formulario W-2 con el impuesto federal retenido, agrega estos ingresos en la sección de <strong>Trabajos con un empleador (W-2)</strong>.
  modal-self-employment-gross-total:
    heading: ¿Qué es el ingreso bruto y dónde lo encuentro?
    p-47ef44: <strong>¿Qué es?</strong>
    p-7caa26: El ingreso bruto es el monto total que esperas recibir este año antes de descontar impuestos, deducciones o gastos.
    p-2c88f0: Si esperas recibir cualquier pago adicional este año como bonos, propinas o pagos por horas extra, inclúyelos en el total del ingreso bruto.
    p-947881: <strong>¿Dónde lo encuentro?</strong>
    p-807ad5: Puedes estimar el total del ingreso bruto llevando la cuenta de cuánto recibes de tus trabajos por cuenta propia. Podrías necesitar estimar tus ingresos por trabajos por cuenta propia para todo el año.
    p-4ac7d7: <strong>¿Cómo puedo revisar la declaración de impuestos del año pasado?</strong>
    p-55c57e: Si trabajaste por cuenta propia el año pasado y esperas recibir la misma cantidad este año, puedes encontrar el ingreso bruto en la línea 7 del Anexo C.
  modal-self-employment-deductions:
    heading: ¿Qué significa restar gastos?
    p-8ac763: Cuando trabajas por cuenta propia, por encargo, o eres dueño de un negocio, podrías restar algunos gastos de tus ingresos para pagar menos impuestos.
    p-643fbe: 'Gastos de negocios podrían incluir:'
    ul-0:
      li-6a4179: Gastos de la oficina en casa
      li-e2f63f: Gastos de un auto o camioneta
      li-7f4118: Renta
      li-9f53a8: Pagos a empleados y pensiones
      li-eaff1b: Seguros
      li-6c49ac: Intereses de deudas
      li-761662: Servicios profesionales o legales
      li-719fec: Impuestos
      li-849c98: Viajes y comidas
    p-68386b: Estas deducciones son diferentes a las deducciones personales que puedes hacer si eliges detallar tus deducciones. Puedes deducir tus gastos del negocio aquí y aun así elegir una deducción estándar después.
    p-4ac7d7: <strong>¿Cómo puedo revisar la declaración de impuestos del año pasado?</strong>
    p-203379: Si trabajaste por cuenta propia el año pasado y esperas que tus gastos del negocio sean iguales, puedes encontrar tus gastos deducibles en la línea 28 del Anexo C.
    p-4ca1ce: <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p334#en_US_2024_publink1000313491">Conoce más sobre los gastos del negocio</a>
  modal-what-counts-unemployment:
    heading: ¿Qué cuenta como ingresos por desempleo?
    p-5c629b: El ingreso por desempleo es un programa conjunto estatal y federal que proporciona beneficios monetarios para trabajadores elegibles.
    p-d575d4: Para recibir desempleo, debes haber perdido tu trabajo por motivos fuera de tu control y cumplir con otros requisitos.
    p-c2b99e: A fin de año debes recibir el Formulario 1099-G que indica el monto que recibiste en el año.
    p-9e9dfa: <a target="_blank" class="usa-link" href="https://www.irs.gov/individuals/employees/unemployment-compensation">Conoce más sobre el ingreso por desempleo.</a>
  modal-fed-unemployment-tax-withheld:
    heading: ¿Cómo puedo saber si me retuvieron impuestos?
    p-097607: Puedes elegir que retengan el 10% del impuesto federal de tus ingresos por desempleo. Para esto, envía el Formulario W-4V a la oficina de desempleo.
    p-68c79a: '<strong>Como revisar si se te retienen impuestos:</strong>'
    ul-0:
      li-00bded: Revisa tu estado de cuenta de desempleo y busca la retención de impuesto federal
      li-68b85b: Llama a la oficina de desempleo y pregunta sobre tus retenciones
    p-2b258d: Si no elegiste retener impuestos, elige “no”.
  modal-what-counts-pre-tax-retirement:
    heading: ¿Qué cuenta como una distribución de una cuenta de jubilación pre-impuestos?
    p-a7106a: Una distribución es cualquier retiro de fondos pre-impuestos de una cuenta 401(k), 403(b), 457(b) o plan de jubilación individual tradicional (IRA). Esto incluye distribuciones en la jubilación, retiros tempranos, distribuciones mínimas requeridas (RMDs), y conversiones de pre-impuestos a Roth.
    p-a88342: A fin de año, tu institución financiera te enviará un Formulario 1099-R para reportar estos ingresos.
    p-5a0ed2: '<strong>No incluyas:</strong>'
    ul-0:
      li-20ffee: Distribuciones de cuentas Roth (post-impuestos).
      li-f28c25: Otras formas de ingresos por jubilación como pensiones, anualidades, Seguro Social, u otros ingresos por inversiones. Esos los ingresarás en otra sección.
  modal-estimate-interest-income:
    heading: ¿Qué son ingresos por intereses y cómo puedo estimarlos?
    p-cda131: Tipos comunes de ingresos por intereses incluyen intereses bancarios o de préstamos.
    p-56de4f: Para estimar tus ingresos por intereses, revisa tus declaraciones bancarias para conocer cuánto ganaste en intereses cada mes. Multiplica el promedio mensual por 12 para obtener el estimado del año.
    p-1a43cd: Al calcular ingresos por intereses, es mejor estimar una cantidad mayor. Si haces un cálculo muy bajo, podrías no retener suficiente impuesto federal a lo largo del año.
    p-5258da: <strong>Cómo revisar la declaración del año pasado</strong>
    p-8217dd: 'Si ganaste ingresos por intereses el año pasado y crees que ganarás una cantidad similar este año, busca un monto en:'
    ul-0:
      li-7fd107: La línea 2b del Formulario 1040 de tu declaración del impuesto federal del <fg-show path="/lastTaxYear"/>
  modal-what-are-dividends:
    heading: ¿Qué son dividendos y cómo puedo estimarlos?
    p-79b2c0: Dividendos ordinarios o calificados son pagos que las corporaciones hacen a sus partes interesadas y se basa en las ganancias de una compañía. La diferencia entre ambos es que los dividendos calificados pagan impuestos en una tasa más baja.
    p-504f40: <strong>Cómo estimar dividendos</strong>
    p-8bdec9: Generalmente, los dividendos se pagan cada tres meses. Para estimar tus dividendos, revisa tus estados de cuenta financieros para ver cuánto ganaste en dividendos en lo que va del año. Multiplica tu dividendo trimestral por cuatro (u otro número si no es trimestral) para obtener tu estimado para el año.
    p-65a8c3: Al calcular dividendos, es mejor estimar una cantidad mayor. Si haces un cálculo muy bajo, podrías no retener suficiente impuesto federal a lo largo del año.
    p-5258da: <strong>Cómo revisar la declaración del año pasado</strong>
    p-c52a86: 'Si crees que recibirás los mismos dividendos este año, utiliza el monto del año pasado como tu estimado. Revisa el Formulario 1040 de tu declaración de impuestos del <fg-show path="/lastTaxYear"/>:'
    ul-0:
      li-8406bc: La línea 3b menos la línea 3a para dividendos ordinarios
      li-5810f9: La línea 3a para dividendos calificados
  modal-what-are-short-long-term-gains-losses:
    heading: ¿Qué son ganancias y pérdidas a corto y largo plazo, y cómo puedo estimarlas?
    p-f18360: 'La cantidad de tiempo que tienes un bien determina el tipo de ganancia o pérdida:'
    ul-0:
      li-57b37b: <strong>Ganancias o pérdidas a corto plazo,</strong> si tienes un bien por menos de un año.
      li-02555a: <strong>Ganancias o pérdidas a largo plazo,</strong> si tienen un bien por más de un año.
    p-750d95: <strong>Cómo revisar ganancias y pérdidas</strong>
    p-99bae4: Si tienes una inversión o cuenta de corretaje, revisa tu cuenta o tu último estado de cuenta para conocer cualquier ganancia o pérdida a corto o largo plazo este año.
    p-6412ce: <strong>Cómo estimar ganancias y pérdidas</strong>
    p-62a198: Si piensas vender bienes antes del fin de año, incluye en tu total las ganancias o pérdidas estimadas.
    p-5e1dd9: Cuando estimes ganancias a corto o largo plazo, es mejor estimar una cantidad mayor. Si calculas muy poco, podrías no retener suficiente impuesto federal a lo largo del año.
  modal-rental-expenses-net-income:
    heading: ¿Qué son gastos relacionados a rentas y cómo puedo estimar el ingreso neto por rentas?
    p-8093b7: Los <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p527#en_US_2024_publink1000218977">gastos de alquiler (en inglés)<span class="usa-sr-only">(abre en una nueva pestaña)</span></a> incluyen costos de mantenimiento, seguro, impuestos e intereses.
    p-21afbd: <strong>Cómo estimar ingresos netos por alquiler</strong>
    p-cd2d5f: Primero, suma todo el dinero que esperas recibir de tus inquilinos durante el año. Luego, resta tus gastos por alquiler.
    p-a1b569: Cuando calcules tus gastos por alquiler, es mejor estimar una cantidad mayor. Si calculas muy poco, podrías no retener suficiente impuesto federal a lo largo del año.
    p-5258da: <strong>Cómo revisar la declaración de impuestos del año pasado</strong>
    p-bfb65a: 'Si ganaste ingresos por alquiler el año pasado y piensas que ganarás un monto similar este año, revisa los siguientes formularios del <fg-show path="/lastTaxYear"/>:'
    ul-0:
      li-3cc72a: Anexo E (Formulario 1040), Parte I, línea 21, Columnas A - C
  modal-estimate-royalty-income:
    heading: ¿Cómo puedo estimar los ingresos por regalías?
    p-7d15b4: Revisa tus acuerdos de licencia o declaraciones de la editorial para conocer los calendarios o porcentajes de pago esperados.
    p-fe4365: Al calcular ingresos de regalías futuras, es mejor estimar una cantidad mayor. Si calculas muy poco, podrías no retener suficiente impuesto federal a lo largo del año.
    p-5258da: <strong>Cómo revisar la declaración de impuestos del año pasado</strong>
    p-3adcf5: 'Si ganaste regalías el año pasado y piensas que ganarás un monto similar este año, revisa los siguientes formularios del <fg-show path="/lastTaxYear"/>:'
    ul-0:
      li-90f9a8: Anexo E (Formulario 1040), Parte 1, línea 23b
  modal-estimate-s-corp-partnership-income:
    heading: ¿Cómo puedo estimar ingresos por una corporación S o una asociación?
    p-ba76b7: Puedes usar los informes para inversores, declaraciones de ganancias y pérdidas, u otra información del negocio para calcular las ganancias anuales. Multiplica esas ganancias por tu porcentaje de propiedad o participación distributiva.
    p-ac18cb: Cuando estimes ingresos de una corporación S o de asociaciones, es mejor estimar una cantidad mayor. Si calculas muy poco, podrías no retener suficiente impuesto federal a lo largo del año.
    p-ebe3e4: No incluyas los ingresos que hayas anotado en la sección de trabajo por cuenta propia.
    p-cc9218: <strong>Cómo revisar la declaración de impuestos del año pasado</strong>
    p-17e6c6: 'Si el año pasado recibiste ganancias de una corporación S o una asociación y crees que recibirás una cantidad similar este año, revisa estos documentos en tu declaración del <fg-show path="/lastTaxYear"/>:'
    ul-0:
      li-b8bcfa: Para ingresos pasivos, anexo E (Formulario 1040), Parte II, Línea 29a, Columna h
      li-f37c1e: Para ingresos activos, anexo E (Formulario 1040), Parte II, Línea 29a, columna k
  modal-estimate-future-bonus:
    heading: ¿Cómo puedo estimar el monto de bonos futuros?
    p-185c7d: Usualmente, un bono es un pago único adicional a tu salario.
    p-74fc7e: Si esperas recibir un bono a fin de año o a fin de trimestre, incluye esta cantidad.
    p-c6a009: Está bien incluir una idea de la cantidad que recibirás. También puedes dejar la casilla de bonos futuros en blanco.
    p-9b4c52: <strong>No incluyas</strong> pagos de bonos pasados que ya recibiste este año.
    p-1b848e: Si en el <fg-show path="/taxYear"/> esperas ganar $1 millón o más en bonos, el estimador no podrá hace un cálculo preciso para tu estimado. Esto incluye todo bono que ya recibiste este año.
    p-74606c: Revisa la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p15sp#es_ES_2026_publink1000143523">Publicación 15</a> para ayuda con el cálculo de retenciones en bonos de monto alto, o considera consultar con un profesional de impuestos.
  modal-job-check-bonus:
    heading: ¿Cómo puedo revisar si recibí un bono en este periodo de pago?
    p-9a2f97: Usualmente, los bonos son un pago único y adicional a tu salario regular.
    p-76b2cb: Para revisar si recibiste un bono en el <strong>periodo de pago actual:</strong>
    ol-0:
      li-5e0c98: Encuentra la entrada de ingreso bruto o total para el periodo de pago. Este sólo incluye el pago por los días que trabajaste por este cheque.
      li-5a7657: Revisa si hay un monto llamado bono (bonus, en inglés), incluído en el ingreso total o bruto para este periodo de pago.
    p-529826: <strong>No incluyas</strong> bonos que aparezcan en el monto acumulado del año (YTD, en inglés). Sólo cuenta bonos del cheque actual. No incluyas pago por horas extra.
  modal-job-gross-ytd-end:
    heading: ¿Cómo puedo encontrar el ingreso bruto en lo que van del <fg-show path="/taxYear"/>?
    p-1f18fb: El ingreso bruto es el monto total de tu sueldo antes de restarle impuestos y otras deducciones.
    p-dd6213: Si recibiste cualquier pago adicional este año, como un bono, propinas o tiempo extra, estará incluido en el ingreso bruto.
    p-654d7e: <strong>Dónde encontrarlo</strong>
    p-a181b2: Revisa el monto acumulado del año (YTD, en inglés) en tu talón de cheque de pago. Este incluye toda tu paga del <fg-show path="/taxYear"/> hasta la fecha.
  modal-estimate-tips:
    heading: ¿Cómo puedo estimar propinas?
    p-cf271a: 'Para estimar el total de propinas que recibirás en el <fg-show path="/taxYear"/>:'
    p-1bf124: <strong>Primero,</strong> revisa tu talón de cheque para ver las <strong>propinas hasta la fecha</strong> (“year-to-date tips“). Esto incluye todas las propinas que has recibido hasta el momento.
    ul-0:
      li-934301: En un talón de cheque, las propinas podrían llamarse Otros o Propinas (“Other,“ “Tips“)
    p-368b23: <strong>Luego,</strong> suma las cantidades que crees que recibirás el resto del <fg-show path="/taxYear"/>.
    p-bb8a8e: Si es difícil de estimar, está bien usar el monto que has recibido hasta ahora, o dejar la casilla en blanco.
    p-ae35ae: Evita usar una cantidad mayor a lo que puedes estimar con seguridad. Esto podría hacer tu estimado menos preciso.
  modal-estimate-overtime:
    heading: ¿Cómo puedo estimar las horas extra?
    p-d2bd4e: 'Para estimar tu total por horas extra en el <fg-show path="/taxYear"/>:'
    p-b3d7ea: <strong>Primero,</strong> revisa tu talón de cheque para ver las <strong>horas extra del año</strong> (“year-to-date-overtime”). Esto incluye todas las horas extra por las que te pagaron en lo que va del año.
    ul-0:
      li-f9b117: El pago por horas extra podría llamarse horas OT, pago OT, pago 1.5 o tiempo y medio en tu talón de cheque (“OT hours”, “OT pay”, “1.5 pay” o “time-and-a-half”)
      li-766c0d: Si las horas extra aparecen en varias líneas del talón de cheque, súmalas
      li-89431a: Solo incluye las horas extra que acumulaste por trabajar más de 40 horas por semana
    p-368b23: <strong>Luego,</strong> agrega toda cantidad que piensas que recibirás en lo que queda del <fg-show path="/taxYear"/>.
    p-c62d72: Si es difícil de calcular, puedes ingresar sólo lo que has recibido hasta el momento o dejar la casilla en blanco.
    p-5d7be0: Evita usar una cantidad mayor a lo que puedes estimar con seguridad. Esto podría hacer tu estimado menos preciso.
    p-c62c8e: El pago por horas extra que no se require según la sección 7 del FLSA (p. ej., por ley estatal o contrato de sindicato) no es deducible y no debe ingresarse en el estimado.
  modal-estimate-overtime-rate:
    heading: ¿Qué pasa si me pagan una tarifa diferente por horas extra?
    p-73dc6c: 'Si te pagan por tiempo extra con una tarifa diferente a 1.5 o 2 veces tu sueldo regular:'
    ul-0:
      li-a0e864: Elige la opción más cercana a tu tarifa de paga por horas extra
  modal-fed-tax-pay-period:
    heading: ¿Cómo puedo encontrar el impuesto federal retenido por periodo de pago?
    p-3d5320: Esta es una cantidad que se retiene de tu cheque para pagar el impuesto federal a lo largo del año.
    p-33ac3f: 'Dónde encontrar el impuesto federal que se retuvo <strong>por periodo de pago</strong> en tu talón de cheque:'
    ul-0:
      li-8bab4d: El impuesto federal retenido podría aparecer como una sola línea etiquetada <strong>Impuestos</strong>. Si pediste que retuvieran un monto adicional de tu cheque para el impuesto federal, podría aparecer en una línea aparte. Asegúrate de agregar ambas cantidades.
      li-9defdf: También podría aparecer bajo el nombre FIT, FITW, FITC, Fed W/H, Fed tax, Fed withholding, Federal income tax o algo similar.
      li-c119f5: Revisa la cantidad por periodo de pago. Sólo debe incluir el impuesto federal retenido de este cheque.
    p-d6e23c: <strong>No incluyas</strong> impuestos estatales, locales, Medicare, Seguro Social u otras cantidades retenidas.
  modal-fed-tax-ytd:
    heading: ¿Cómo puedo encontrar el impuesto federal retenido en lo que va del <fg-show path="/taxYear"/>?
    p-01be0a: Esta es una cantidad que se retiene de tu cheque para pagar el impuesto federal a lo largo del año.
    p-583ef9: 'Dónde encontrar el impuesto federal retenido en <strong>lo que va del año</strong> en tu talón de cheque:'
    ul-0:
      li-92a8b4: El impuesto federal retenido podría aparecer como una sola línea etiquetada <strong>Impuestos</strong>. Si pediste que retuvieran un monto adicional de tu cheque para el impuesto federal, podría aparecer en una línea aparte. Asegúrate de agregar ambas cantidades.
      li-9defdf: También podría aparecer bajo el nombre FIT, FITW, FITC, Fed W/H, Fed tax, Fed withholding, Federal income tax o algo similar.
      li-af3b9e: Revisa la <strong>cantidad acumulada del año</strong> (year-to-date o YTD). Esto incluye todo el impuesto federal que se retuvo para el año hasta el momento.
    p-d6e23c: <strong>No incluyas</strong> impuestos estatales, locales, Medicare, Seguro Social u otras cantidades retenidas.
/adjustments:
  title: Ajustes
  h2-9fa8b1: Ajustes
  p-efc304: Estima el monto de ajustes que <span condition="/isFilingStatusMFJ"
    operator="isFalse">piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">piensan</span> tomar este año.
  p-624555: <modal-link for="modal-what-are-adjustments">¿Qué son ajustes?</modal-link>
  p-9b971e: Este estimador sólo acepta algunos ajustes. Podrían haber otros ajustes para los que calificas y que podrían impactar tu estimado.
  h3-2c7735: Deducción del interés de un préstamo estudiantil
  p-29379e: Si eres legalmente responsable de pagar el interés en un préstamo estudiantil calificado, puedes deducir hasta <fg-show path="/maxStudentLoanDeduction"/> en pagos de interés. El préstamo debe ser para ti, tu esposo(a) o un dependiente.
  p-3519c2: Esto incluye pagos de interés prepagados, tanto requeridos como voluntarios.
  p-cf7cae: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc456" class="usa-link">
    Conoce más sobre el interés de un préstamo estudiantil. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /studentLoanInterestAmount:
    question: Interés de préstamo estudiantil que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/maxStudentLoanDeduction"/>)
  h3-9166fe: Deducción para el educador
  p-b30c3d: Si eres un educador de K-12 puedes deducir hasta <fg-show path="/maxEducatorExpensesNotMFJ"/> por gastos no reembolsados en el <fg-show path="/taxYear"/>. <span condition="/isFilingStatusMFJ"
    operator="isTrue">Si presentas una declaración conjunta y ambos son educadores, pueden deducir hasta <fg-show path="/maxEducatorExpensesMFJ"/>.</span>
  p-dd188e: 'Los gastos calificados incluyen:'
  ul-0:
    li-0b8a3d: Cursos de desarrollo profesional
    li-c31915: Libros, útiles, equipo de computador (incluyendo programas y servicios relacionados)
    li-f3a059: Otros equipos y materiales suplementarios que uses en el salón de clase
  p-b20cac: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc458" class="usa-link">Conoce más sobre gastos del educador. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /educatorExpenses/:
    question: Gastos del educador que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> deducir en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/maxEducatorExpensesLimit"/>)
  h3-e640b9: Deducción por una cuenta IRA tradicional (pre-impuestos)
  p-3269b3: Si contribuyes a una cuenta de jubilación IRA tradicional (pre-impuestos) fuera de las contribuciones de tu nómina en el <fg-show path="/taxYear"/>, podrías reclamar una deducción.
  p-523de9: <strong>No incluyas</strong> cantidades que ya incluiste en uno de tus trabajos, contribuciones a cuentas IRA Roth, o contribuciones a otras cuentas de jubilación.
  p-2bd31f: <a target="_blank" href="https://www.irs.gov/es/retirement-plans/plan-participant-employee/retirement-topics-ira-contribution-limits"
    class="usa-link">Conoce más sobre contribuciones a cuentas de jubilación IRA. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /deductionForTraditionalIRAContribution:
    question: Contribuciones a una cuenta de jubilación IRA tradicional que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> hacer en el <fg-show path="/taxYear"/>
  h3-f9e99b: Deducción por un plan de jubilación para un trabajador por cuenta propia
  p-8a03a1: Si <span condition="/isFilingStatusMFJ" operator="isFalse">trabajas</span><span condition="/isFilingStatusMFJ" operator="isTrue">trabajan</span> por tu cuenta y <span condition="/isFilingStatusMFJ" operator="isFalse">haces</span><span condition="/isFilingStatusMFJ" operator="isTrue">hacen</span> contribuciones en el <fg-show path="/taxYear"/> a un plan de jubilación calificado, podrías ser <span condition="/isFilingStatusMFJ" operator="isFalse">elegible</span><span condition="/isFilingStatusMFJ" operator="isTrue">elegibles</span> para esta deducción.
  p-f0de33: 'Para calificar <span condition="/isFilingStatusMFJ" operator="isFalse">debes</span><span condition="/isFilingStatusMFJ" operator="isTrue">deben</span>:'
  ul-1:
    li-05453e: Ser <span condition="/isFilingStatusMFJ" operator="isFalse">el propietario único</span><span condition="/isFilingStatusMFJ" operator="isTrue">propietarios únicos</span> del negocio
    li-292ab3: Ser parte de una asociación de negocios, o
    li-4bca7f: Tener una compañía de responsabilidad limitada
  p-345fbc: 'Los planes elegibles podrían incluir:'
  ul-2:
    li-ff93fe: Plan de pensión simplificado del empleado (SEP)
    li-200ab4: Plan SIMPLE (Savings Incentive Match Plan for Employees)
    li-e7dbe4: Solo-401(k)
    li-765afa: Otros planes de jubilación calificados
  p-af5a4a: <strong>No incluyas</strong> contribuciones a cuentas individuales de jubilación (IRA).
  p-09dfdf: Debes usar reglas especiales para calcular las contribuciones a un plan de jubilación.
  p-3248f2: <a target="_blank" href="https://www.irs.gov/es/retirement-plans/self-employed-individuals-calculating-your-own-retirement-plan-contribution-and-deduction"
    class="usa-link">Conoce más sobre las contribuciones a planes de jubilación para trabajadores por cuenta propia. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /selfEmploymentRetirementPlanContributions:
    question: Contribuciones a un plan de jubilación de ingresos por trabajo por cuenta propia que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> hacer en el <fg-show path="/taxYear"/>
  h3-940849: Deducción por una Cuenta de ahorros para la salud (HSA)
  p-fc912f: Si <span condition="/isFilingStatusMFJ" operator="isFalse">contribuyes</span><span condition="/isFilingStatusMFJ" operator="isTrue">contribuyen</span> a una cuenta HSA fuera de las contribuciones de <span condition="/isFilingStatusMFJ" operator="isFalse">tu nómina</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus nóminas</span> en el <fg-show path="/taxYear"/>, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> reclamar una deducción.
  p-739bad: <strong>No incluyas</strong> cantidades que ya incluiste en uno de tus trabajos.
  p-427dc4: <a target="_blank" href="https://www.irs.gov/forms-pubs/about-publication-969"
    class="usa-link">Conoce más sobre las contribuciones a una cuenta HSA (en inglés). <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /hsaContributionAmount:
    question: Contribuciones a una cuenta HSA que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> hacer en el <fg-show path="/taxYear"/>
  h3-5574f6: Deducción por pensión alimenticia
  p-e03d05: Puedes deducir la pensión alimenticia que le pagaste en el <fg-show path="/taxYear"/> a un esposo(a) o ex esposo(a) bajo un instrumento de divorcio o separación hecho antes del 2019.
  p-0c3c0d: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc452" class="usa-link">Conoce más sobre la pensión alimenticia. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /alimonyPaid:
    question: Pensión alimenticia que esperas pagar en el <fg-show path="/taxYear"/>
  h3-913117: Multa por retiro anticipado de ahorros
  p-5c9299: Si <span condition="/isFilingStatusMFJ" operator="isFalse">retiraste</span><span condition="/isFilingStatusMFJ" operator="isTrue">retiraron</span> fondos de un certificado de depósito u otra cuenta de interés diferido antes del tiempo acordado, <span condition="/isFilingStatusMFJ" operator="isFalse">tu</span><span condition="/isFilingStatusMFJ" operator="isTrue">su</span> institución financiera podría <span condition="/isFilingStatusMFJ" operator="isFalse">haberte</span><span condition="/isFilingStatusMFJ" operator="isTrue">haberles</span> cobrado una multa en el <fg-show path="/taxYear"/>. <span condition="/isFilingStatusMFJ" operator="isFalse">Puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">Pueden</span> deducir el monto de la multa.
  p-0dd4e9: <a target="_blank" href="https://www.irs.gov/retirement-plans/plan-participant-employee/retirement-topics-exceptions-to-tax-on-early-distributions"
    class="usa-link">Conoce más sobre las multas por retiro anticipado (en inglés). <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /penaltyForEarlySavingsWithdrawal:
    question: Monto de la multa que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h3-640ae5: Gastos de mudanza para la comunidad militar y de inteligencia
  p-bc1f1a: 'Puedes deducir gastos de mudanza hechos en el <fg-show path="/taxYear"/> y que no se hayan reembolsado si:'
  ul-3:
    li-a1710a: <span condition="/isFilingStatusMFJ" operator="isFalse">Eres miembro</span><span condition="/isFilingStatusMFJ" operator="isTrue">Tú o tu esposo(a) son miembros</span> de las Fuerzas Armadas en deber activo y la mudanza fue a causa de una orden militar y un cambio de estación permanente, o
    li-b646ac: <span condition="/isFilingStatusMFJ" operator="isFalse">Eres empleado o te </span><span condition="/isFilingStatusMFJ" operator="isTrue">Tú o tu esposo(a) son empleados o les</span> han designado a la comunidad de inteligencia y la mudanza fue a causa de un cambio de asignación que requirió relocalización
  p-b7904a: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc455" class="usa-link">Conoce más sobre los gastos de mudanza para la comunidad militar y de inteligencia. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /movingExpensesForArmedServicesMembers:
    question: Gastos de mudanza que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h3-bcc8a5: Algunos gastos de negocios
  p-9fb630: '<span condition="/isFilingStatusMFJ" operator="isFalse">Si eres</span><span condition="/isFilingStatusMFJ" operator="isTrue">Si tú o tu esposo(a) son</span> parte de la reserva de las Fuerzas Armadas, <span condition="/isFilingStatusMFJ" operator="isFalse">un artista intérprete</span><span condition="/isFilingStatusMFJ" operator="isTrue">artistas intérpretes</span>, <span condition="/isFilingStatusMFJ" operator="isFalse">funcionario</span><span condition="/isFilingStatusMFJ" operator="isTrue">funcionarios</span> del gobierno estatal o local que cobra honorarios, o <span condition="/isFilingStatusMFJ" operator="isFalse">un empleado</span><span condition="/isFilingStatusMFJ" operator="isTrue">empleados</span> con una discapacidad y gastos de trabajo relacionados a esta, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir gastos en el <fg-show path="/taxYear"/> que:'
  ul-4:
    li-a7cbed: Son comunes y aceptados en <span condition="/isFilingStatusMFJ" operator="isFalse">tu campo</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus campos</span> de trabajo, negocios o profesión
    li-e1fa4e: Son útiles y apropiados para <span condition="/isFilingStatusMFJ" operator="isFalse">tus</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus</span> negocios
  p-30ab2e: <a target="_blank" href="https://www.irs.gov/instructions/i2106" class="usa-link">Conoce más sobre algunos gastos de negocios (en inglés). <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /businessCreditsForEligible:
    question: Gastos de negocio elegibles que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h3-5c4fd4: Deducción por seguro médico del trabajador por cuenta propia
  p-105416: <span condition="/isFilingStatusMFJ" operator="isFalse">Si trabajas</span><span condition="/isFilingStatusMFJ" operator="isTrue">Tú o tu esposo(a) trabajan</span> por cuenta propia y <span condition="/isFilingStatusMFJ" operator="isFalse">tienes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tienen</span> ganancias netas este año, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir las primas del <fg-show path="/taxYear"/> del seguro médico.
  p-082b2a: 'Las primas elegibles son: médicas, dentales, de visión y seguro de cuidado a largo plazo. La póliza puede ser para ti, tu esposo(a) o un dependiente. La póliza también puede cubrir a un hijo(a) si es menor de 27 años a fin del año, aun si no es tu dependiente.'
  p-13dece: <a target="_blank" href="https://www.irs.gov/es/node/131041" class="usa-link">Conoce más sobre las deducciones por seguro médico para el trabajador por cuenta propia (en inglés). <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
  /selfEmploymentHealthInsuranceContributions:
    question: Primas de seguro médico que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  modal-what-are-adjustments:
    heading: ¿Qué son ajustes?
    p-c60313: Los ajustes son un tipo de deducción. Son gastos, pagos y contribuciones que podrías restar del total de tus ingresos para reducir la cantidad que está sujeta a impuestos.
/deductions:
  title: Elección de deducción
  h2-414252: Deducción estándar o detallada
  p-cbf5dd: Cuando preparas tu declaración de impuestos, puedes reducir la cantidad de tus ingresos sujeta a impuestos al elegir <modal-link for="modal-standard-deduction-or-itemize-deductions">deducciones estándar o detalladas</modal-link>.
  p-4f0299: La mayoría elige deducciones estándar porque la cantidad es mayor de lo que recibirían al detallar sus deducciones.
  p-d4ef4d: Si eliges detallar tus deducciones, te preguntaremos sobre tus gastos y calcularemos la cantidad total para ti.
  p-550c0f: Si tu estatus civil es Casado(a) que presenta una declaración por separado, debes tomar el mismo tipo de deducción que tu esposo(a).
  p-ade196: <modal-link for="modal-standard-deduction-amount">Según tus respuestas</modal-link>, tu deducción estándar es de <fg-show path="/standardDeduction"/>.
  p-b3aa46: Según tus respuestas, tu deducción estándar es de <fg-show path="/standardDeduction"/>.
  /wantsStandardDeduction:
    question: Elige si quieres tomar la deducción estándar o detallar tus deducciones.
    options:
      'true':
        name: Usar la deducción estándar (<fg-show path="/standardDeduction"/>)
      'false':
        name: Detallar deducciones
  h3-a1ad7c: Deducciones detalladas
  p-c47c3b: Si eliges tomar la deducción detallada, necesitaremos hacerte más preguntas.
  p-71dd8c: Si el total de tus deducciones detalladas es mayor a la deducción estándar, usaremos esa cantidad para calcular tus resultados. Esto te favorece más.
  p-fb9061: Elegiste usar la deducción estándar en vez de la deducción detallada. Continúa a la siguiente página.
  p-86e60d: Estima el monto de las deducciones que <span condition="/isFilingStatusMFJ" operator="isFalse">piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">piensan</span> tomar este año.
  h4-a883ab: Impuesto local y estatal
  p-29bab3: Si <span condition="/isFilingStatusMFJ" operator="isFalse">pagas</span><span condition="/isFilingStatusMFJ" operator="isTrue">pagan</span> impuestos locales y estatales, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir hasta <fg-show path="/stateAndLocalTaxDeductionLimit"/>.
  p-5ea630: '<span condition="/isFilingStatusMFJ" operator="isFalse">Puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">Pueden</span> deducir:'
  ul-0:
    li-f7cfbc: Impuesto estatal y local a los bienes inmuebles
    li-da32d6: Impuesto estatal y local a la propiedad
  p-b6c1cd: 'También <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir uno de los siguientes:'
  ul-1:
    li-1c452e: Impuesto estatal y local sobre los ingresos
    li-2afba5: Impuesto estatal y local sobre las ventas
  p-91100f: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc503" class="usa-link">Conoce más sobre los impuestos locales y estatales.</a>
  /stateAndLocalTaxPayments:
    question: Impuestos locales y estatales que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/stateAndLocalTaxDeductionLimit"/>)
  h4-627030: Donaciones caritativas
  p-693a4b: Si <span condition="/isFilingStatusMFJ" operator="isFalse">haces</span><span condition="/isFilingStatusMFJ" operator="isTrue">hacen</span> una donación a una organización calificada, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducirla.
  p-e1d782: <a target="_blank" href="https://www.irs.gov/es/charities-non-profits/charitable-organizations/charitable-contribution-deductions" class="usa-link">Conoce más sobre las donaciones caritativas.</a>
  /cashCharitableContributions:
    question: Donaciones caritativas que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> hacer en el <fg-show path="/taxYear"/>
  h4-0aecd8: Intereses hipotecarios calificados e intereses por inversiones
  p-ca41f8: Si <span condition="/isFilingStatusMFJ" operator="isFalse">pides</span><span condition="/isFilingStatusMFJ" operator="isTrue">piden</span> un préstamo para comprar una propiedad primaria, secundaria, o de inversión, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir los intereses y puntos que <span condition="/isFilingStatusMFJ" operator="isFalse">pagaste</span><span condition="/isFilingStatusMFJ" operator="isTrue">pagaron</span> para ese préstamo.
  p-94189b: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc505" class="usa-link">Conoce más sobre los intereses hipotecarios y por inversiones.</a>
  /qualifiedMortgageInterestAndInvestmentInterestExpenses:
    question: Intereses calificados que <span condition="/isFilingStatusMFJ" operator="isFalse">piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">piensan</span> pagar en el <fg-show path="/taxYear"/>
  h4-b16091: Primas de seguro hipotecario
  p-a5b47a: Si <span condition="/isFilingStatusMFJ" operator="isFalse">debes</span><span condition="/isFilingStatusMFJ" operator="isTrue">deben</span> pagar seguro hipotecario en el <fg-show path="/taxYear"/>, <span condition="/isFilingStatusMFJ" operator="isFalse">podrías</span><span condition="/isFilingStatusMFJ" operator="isTrue">podrían</span> deducirlo. <span condition="/isFilingStatusMFJ" operator="isFalse">Tu</span><span condition="/isFilingStatusMFJ" operator="isTrue">El</span> contrato de seguro hipotecario debe haberse emitido en o después del 2007 para una propiedad primaria o secundaria.
  p-2a876a: 'Los seguros hipotecarios calificados incluyen:'
  ul-2:
    li-d21e4b: Seguro hipotecario privado relacionado a préstamos convencionales
    li-1a3c7d: Primas de seguro hipotecario relacionado a préstamos de la Administración Federal de Vivienda
    li-46b019: Costos de financiamiento relacionados a préstamos de Asuntos Veteranos
    li-5d7fc7: Costos y garantías relacionados a préstamos de la Administración de Vivienda Rural
  /qualifiedMortgageInsurancePremiums:
    question: Primas de seguro hipotecario que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h4-2ad5b3: Deducción por gastos médicos y dentales
  p-30a251: Si <span condition="/isFilingStatusMFJ" operator="isFalse">pagas</span><span condition="/isFilingStatusMFJ" operator="isTrue">pagan</span> de <span condition="/isFilingStatusMFJ" operator="isFalse">tu</span><span condition="/isFilingStatusMFJ" operator="isTrue">su</span> bolsillo (y el seguro médico no <span condition="/isFilingStatusMFJ" operator="isFalse">te</span><span condition="/isFilingStatusMFJ" operator="isTrue">les</span> reembolsa) por gastos médicos y dentales o primas, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir el monto total de <span condition="/isFilingStatusMFJ" operator="isFalse">tus</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus</span> gastos por encima de <fg-show path="/medicalAndDentalExpensesFloor"/>.
  p-ebaf9f: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc502" class="usa-link">Conoce más sobre los gastos médicos y dentales.</a>
  /medicalAndDentalExpenses:
    question: Gastos médicos y dentales que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
    hint: No incluyas primas de seguro que ya agregaste en la sección de Ingresos o Ajustes.
  h4-e628b2: Pérdidas imprevistas (fortuitas)
  p-e1d1d9: Si <span condition="/isFilingStatusMFJ" operator="isFalse">sufres</span><span condition="/isFilingStatusMFJ" operator="isTrue">sufren</span> pérdidas por accidentes, desastres, o robos debido a un desastre declarado a nivel federal o estatal, <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducirlas.
  p-999102: También <span condition="/isFilingStatusMFJ" operator="isFalse">puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">pueden</span> deducir pérdidas por robo relacionadas a transacciones lucrativas, incluyendo estafas.
  p-10956c: Algunas pérdidas imprevistas requieren que restes $100 por evento y <fg-show path="/casualtyLossesAgiLimit"/> de tu deducción. Esto sería el 10% de <span condition="/isFilingStatusMFJ" operator="isFalse">tu</span><span condition="/isFilingStatusMFJ" operator="isTrue">su</span> ingreso bruto ajustado (AGI). Confirma cuáles reglas <span condition="/isFilingStatusMFJ" operator="isFalse">te</span><span condition="/isFilingStatusMFJ" operator="isTrue">les</span> aplican antes de ingresar una cantidad.
  p-39aa78: <a target="_blank" href="https://www.irs.gov/es/taxtopics/tc515" class="usa-link">Conoce más sobre las pérdidas imprevistas.</a>
  /casualtyLossesTotal:
    question: Pérdidas imprevistas estimadas para el <fg-show path="/taxYear"/>
  h4-fcd750: Otras deducciones detalladas
  p-e4b51d: '<span condition="/isFilingStatusMFJ" operator="isFalse">Podrías</span><span condition="/isFilingStatusMFJ" operator="isTrue">Podrían</span> deducir estos gastos:'
  ul-3:
    li-78ebd4: Prima amortizable sobre bonos sujetos a impuestos
    li-bde3ca: Pérdidas fortuitas y por robo relacionadas a una propiedad que genera ingresos
    li-7a25f3: Deducciones en exceso (incluyendo gastos administrativos) permitidas a un beneficiario al finalizar un patrimonio o fideicomiso
    li-e782c2: Impuesto federal sobre el patrimonio de una persona fallecida
    li-8a47cf: Montos pagados como parte de tu profesión o negocios que representan una restitución, remediación, o se pagaron para cumplir con la ley
    li-b60c39: 90% de las pérdidas por juegos de azar y hasta el total de las ganancias
    li-84271d: Gastos de trabajo relacionados con una discapacidad
    li-df57a9: Pérdidas por inversiones de estilo Ponzi
    li-9fbb8c: Reembolsos de más de $3,000 por un reclamo de derecho
    li-202051: Costos deducibles relacionados a cualquier acción que involucre un reclamo por discriminación
    li-5c9c06: Inversiones en una anualidad que no se recuperaron
    li-d57dd2: Una pérdida ordinaria relacionada a un instrumento de deuda de pago contingente, o un instrumento de deuda indexado a la inflación (p. ej., un título del Tesoro, protegido contra la inflación)
  p-3c5570: <a target="_blank" href="https://www.irs.gov/publications/p529" class="usa-link">Conoce más sobre otras deducciones.</a>
  /otherDeductionsTotal:
    question: Estimado de otras deducciones para el <fg-show path="/taxYear"/>
  h4-ab9771: 'Total de deducciones detalladas: <fg-show path="/itemizedDeductionTotal"/>'
  p-db6824: 'Cuando calculemos tus resultados, usaremos el monto mayor: la deducción estándar o el total de tus deducciones detalladas.'
  modal-standard-deduction-or-itemize-deductions:
    heading: ¿Qué es una deducción estándar y una deducción detallada?
    p-05b623: La deducción <strong>estándar</strong> y la <strong>detallada</strong> son formas de reducir el monto de tus ingresos sujetos a impuestos.
    p-612298: La deducción estándar es una cantidad fija que se resta de tus ingresos. Se calcula según tu estado civil al declarar impuestos y según si tú o tu esposo(a) tienen 65 o más, son ciegos, o alguien más puede reclamarlos como un dependiente en el año fiscal.
    p-b8a25f: Detallar deducciones significa totalizar cada deducción del <a target="_blank" href="https://www.irs.gov/es/forms-pubs/about-schedule-a-form-1040" class="usa-link">Anexo A<span class="usa-sr-only"> (abre en una nueva pestaña)</span></a> para la que calificas, artículo por artículo.
    p-9d31c1: La mayoría de personas toman la deducción estándar, pero podrías querer intentar detallar tus deducciones si tienes una hipoteca, donaciones caritativas grandes o gastos médicos altos.
    p-a2eb42: Ahorrarás dinero al elegir la opción que se calcule como la mayor deducción.
    p-617b6e: No puedes tomar la deducción estándar si detallas tus deducciones.
    p-531543: <a target="_blank" href="https://www.irs.gov/es/newsroom/tax-basics-understanding-the-difference-between-standard-and-itemized-deductions" class="usa-link">Conoce más sobre la deducción estándar y la detallada.<span class="usa-sr-only"> (abre en una nueva pestaña)</span></a>
  modal-standard-deduction-amount:
    heading: El monto de tu deducción estándar se basa en tus respuestas.
    p-0e3533: Tu deducción estándar es limitada porque otro contribuyente puede reclamarte como un dependiente.
    p-dafa6d: Tu deducción estándar es limitada porque otro contribuyente puede reclamarte, reclamar a tu esposo(a) o reclamarlos a ambos como un dependiente.
    p-bb6ae9: Tu deducción estándar es limitada porque otro contribuyente puede reclamarte, reclamar a tu esposo(a) o reclamarlos a ambos como un dependiente.
    p-3fc80f: 'Se utiliza la mayor de estas dos cantidades: <fg-show path="/tentativeMinimumStandardDeduction"/>, o tus ingresos recibidos más <fg-show path="/earnedIncomeBump"/> (pero no puede ser mayor a <fg-show path="/filingStatusStandardDeduction"/>).'
    p-d9e6c0: 'Sobre esa cantidad, se agrega otro monto porque:'
    p-bc0d47: '<span condition="/isFilingStatusMFJ" operator="isTrue">Su</span><span condition="/isFilingStatusMFJ" operator="isFalse">Tu</span>
      deducción estándar se basa en el estado civil de <span condition="/isFilingStatusMFJ"
      operator="isTrue">Casado(a) que presenta una declaración conjunta</span><span condition="/isFilingStatusMFS"
      operator="isTrue">Casado(a) que presenta una declaración por separado</span><span condition="/isFilingStatusSingle"
      operator="isTrue">Soltero(a)</span><span condition="/isFilingStatusHOH" operator="isTrue">Cabeza
      de familia</span><span condition="/isFilingStatusQSS" operator="isTrue">Esposo(a) sobreviviente
      calificado</span> y un monto adicional porque:'
    ul-0:
      li-09216d: Tendrás 65 años o más a fin de año
      li-603910: Tu esposo(a) tendrá 65 años o más a fin de año
      li-b4e324: Tendrán 65 años o más a fin de año
      li-80f87f: Eres ciego(a)
      li-6a4489: Tu esposo(a) es ciego(a)
      li-e4bf17: Uno o ambos de ustedes es ciego(a)
    p-722e90: <a target="_blank" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000221051" class="usa-link">Conoce más sobre la deducción estándar.<span class="usa-sr-only"> (abre en una nueva pestaña)</span></a>
/additional-deductions:
  title: Deducciones adicionales
  h2-e64960: Deducciones adicionales
  p-9a1bd3: <span condition="/isFilingStatusMFJ" operator="isFalse">Puedes</span><span condition="/isFilingStatusMFJ" operator="isTrue">Pueden</span> estimar el monto de deducciones adicionales que <span condition="/isFilingStatusMFJ" operator="isFalse">piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">piensan</span> tomar este año.
  p-13d235: Ya sea que <span condition="/isFilingStatusMFJ" operator="isFalse">tomes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tomen</span> la deducción estándar o la detallada, estas deducciones pueden reducir aun más la cantidad de <span condition="/isFilingStatusMFJ" operator="isFalse">tus</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus</span> ingresos que estaría sujeta a impuestos.
  h3-cf5852: Donaciones caritativas en efectivo
  p-b36cd1: Si tomas la deducción estándar y haces una donación a una organización calificada en el <fg-show path="/taxYear"/>, puedes deducir donaciones en efectivo hasta <fg-show path="/actualNonItemizerCharitableContributionDeductionMax"/>.
  p-d8609e: 'Las donaciones en efectivo incluyen pagos hechos en las siguientes formas:'
  ul-0:
    li-069b30: Efectivo
    li-060bf2: Cheque
    li-5fa5bb: Transferencia electrónica de fondos, o servicio de pago en línea
    li-1e7cc9: Tarjeta de débito o crédito
    li-95186c: Deducción en tu nómina
    li-53c28e: Transferencia de una tarjeta de regalo que puede canjearse por efectivo
  p-76b3ac: <strong>El estimador usará la deducción estándar</strong> porque es mayor que tu deducción detallada. Si agregaste donaciones caritativas en efectivo, vuelve a agregar esas mismas donaciones aquí.
  p-795838: <a target="_blank" href="https://www.irs.gov/credits-deductions/individuals/deducting-charitable-contributions-at-a-glance"
    class="usa-link">Conoce más sobre las donaciones caritativas en efectivo.</a>
  /nonItemizerCharitableContributionDeductionAmount:
    question: Donaciones caritativas en efectivo que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> hacer en el <fg-show path="/taxYear"/>
    hint: (max <fg-show path="/actualNonItemizerCharitableContributionDeductionMax"/>)
  h3-88e0af: Deducción adicional para adultos mayores
  p-f250e6: Desde el 2025 hasta el 2028, los contribuyentes de 65 años o más podrán reclamar una deducción adicional de hasta <fg-show path="/maxSeniorDeductionAmount"/>.
  p-51dacf: <a target="_blank" href="https://www.irs.gov/newsroom/one-big-beautiful-bill-act-tax-deductions-for-working-americans-and-seniors"
    class="usa-link">Conoce más sobre la deducción adicional para adultos mayores.</a>
  /primaryTaxpayerElectsForSeniorDeduction:
    question: ¿Piensas tomar la deducción adicional para adultos mayores?
    hint: Elige “No” si no tienes un número de Seguro Social
  /secondaryTaxpayerElectsForSeniorDeduction:
    question: ¿Tu esposo(a) piensa tomar la deducción adicional para adultos mayores?
    hint: Elige “No” si no tiene un número de Seguro Social
  h3-f830e5: Deducción de intereses de préstamos para automóviles
  p-b98393: Si <span condition="/isFilingStatusMFJ" operator="isFalse">pagaste</span><span condition="/isFilingStatusMFJ" operator="isTrue">pagaron</span> intereses por un préstamo de un automóvil en el <fg-show path="/taxYear"/>, <span condition="/isFilingStatusMFJ" operator="isFalse">podrías</span><span condition="/isFilingStatusMFJ" operator="isTrue">podrían</span> deducir hasta <fg-show path="/maxQPVLIDAmount"/> de los intereses que <span condition="/isFilingStatusMFJ" operator="isFalse">pagaste</span><span condition="/isFilingStatusMFJ" operator="isTrue">pagaron</span>.
  p-d7066d: 'Para calificar para la deducción, el interés debe pagarse en un préstamo que:'
  ul-1:
    li-de646c: Se originó en el 2025 o después
    li-c01c71: Está respaldado por un gravamen en el auto (esto es un derecho legal del prestamista para asegurar el pago del préstamo)
    li-2e73bf: Se usó para comprar un vehículo calificado para uso personal
  p-9b605a: 'Un vehículo calificado es un auto, minivan, van, vehículo deportivo de utilidad, camioneta, o motocicleta que:'
  ul-2:
    li-13960a: Es nuevo (no usado)
    li-1ac6c8: Tuvo su ensamblaje final en los Estados Unidos
    li-14ccc7: Tiene un peso bruto menor a 14,000 libras
    li-71d229: Se manufacturó para uso principalmente en calles públicas, carreteras y autopistas
  p-62c99d: <a target="_blank" href="https://www.irs.gov/newsroom/one-big-beautiful-bill-act-tax-deductions-for-working-americans-and-seniors"
    class="usa-link">Conoce más sobre los intereses de préstamos para autos calificados.</a>
  p-43c67d: <a target="_blank" href="https://vpic.nhtsa.dot.gov/decoder/" class="usa-link">Revisa si tu auto se ensambló en los Estados Unidos.</a>
  /personalVehicleLoanInterestAmount:
    question: Intereses del préstamo para un auto que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h3-8e5d10: Ingreso calificado de un negocio (QBI)
  p-2a6643: Si <span condition="/isFilingStatusMFJ" operator="isFalse">eres dueño</span><span condition="/isFilingStatusMFJ" operator="isTrue">son dueños</span> en una asociación, corporación S, o <span condition="/isFilingStatusMFJ" operator="isFalse">tienes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tienen</span> trabajo por cuenta propia, <span condition="/isFilingStatusMFJ" operator="isFalse">podrías</span><span condition="/isFilingStatusMFJ" operator="isTrue">podrían</span> tomar una deducción si <span condition="/isFilingStatusMFJ" operator="isFalse">tienes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tienen</span> QBI en el <fg-show path="/lastTaxYear"/>. Esta deducción puede reducirse o eliminarse para algunas empresas de servicios.
  p-c43979: <strong>Según <span condition="/isFilingStatusMFJ" operator="isFalse">tus</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus</span> respuestas, <span condition="/isFilingStatusMFJ" operator="isFalse">tu</span><span condition="/isFilingStatusMFJ" operator="isTrue">el</span> QBI es de <fg-show path="/derivedQualifiedBusinessIncomeDeduction"/>.</strong>
  /wantsDerivedQBIDeduction:
    question: <span condition="/isFilingStatusMFJ" operator="isFalse">Elige si quieres</span><span condition="/isFilingStatusMFJ" operator="isTrue">Elijan si quieren</span> usar el monto de QBI que calculamos según <span condition="/isFilingStatusMFJ" operator="isFalse">tus</span><span condition="/isFilingStatusMFJ" operator="isTrue">sus</span> respuestas o si <span condition="/isFilingStatusMFJ" operator="isFalse">quieres</span><span condition="/isFilingStatusMFJ" operator="isTrue">quieren</span> ingresar un monto diferente.
    modalLink: <modal-link for="modal-qbi-when">¿Cuándo debería ingresar un monto diferente?</modal-link>
    options:
      'true':
        name: Utilizar <fg-show path="/derivedQualifiedBusinessIncomeDeduction"/> para este estimado
      'false':
        name: Ingresar un monto diferente para este estimado
  h3-090c33: Estimado del ingreso calificado de un negocio (QBI)
  p-911b92: 'Para estimar el QBI calcula:'
  ol-0:
    li-eb6dd8: Los ingresos de negocios que esperas en el <fg-show path="/taxYear"/>
    li-5b1108: Resta los gastos comunes del negocio (como renta, materiales, y beneficios de los empleados)
    li-afd842: Resta deducciones relacionas con el empleo por cuenta propia (como primas de seguro de salud para el trabajador por cuenta propia, contribuciones a planes de jubilación para el trabajador por cuenta propia, y la mitad de tu impuesto al trabajador por cuenta propia)
  p-fb0f3c: <a target="_blank" href="https://www.irs.gov/newsroom/qualified-business-income-deduction"
    class="usa-link">Conoce más sobre el ingreso calificado de un negocio.</a>
  /qBIDeductionOverrideAmount:
    question: Monto estimado de QBI para el <fg-show path="/taxYear"/>
    hint: Si tienes dudas, puedes ingresar $0.
  modal-qbi-when:
    heading: ¿Cuándo debería ingresar un monto diferente?
    p-3c9516: Si no eres dueño o no te beneficias economicamente de un negocio o comercio, podrías querer ingresar $0 para la deducción por ingreso calificado de un negocio (QBI)
    p-51c6e8: Si tu ingreso bruto ajustado será mayor a <fg-show path="/qbiPhaseInThreshold"/>, podrías querer ingresar un monto diferente.
    p-92b07b: Calcula la deducción de tu QBI con el <a target="_blank" href="https://www.irs.gov/forms-pubs/about-form-8995">Formulario 8995-A</a>. También puedes usar la misma deducción para QBI que usaste el año pasado como estimado. La encontrarás en la línea 13a de tu Formulario 1040 del <fg-show path="/previousTaxYear"/>.
    p-24ae98: <a target="_blank" href="https://www.irs.gov/newsroom/qualified-business-income-deduction" class="usa-link">Conoce más sobre el QBI. <span class="usa-sr-only">(abre en una nueva pestaña)</span></a>
/credits:
  title: Créditos
  h2-948a2e: Créditos
  p-4dde1f: Los créditos reducen directamente la cantidad de impuestos que debes, dólar por dólar. Algunos créditos pueden aumentar tu reembolso si la cantidad combinada es mayor al impuesto que debes.
  p-7a9f8f: Este estimador solo tiene algunos créditos. Podrían haber otros créditos para los que calificas y que pueden impactar el estimado de tu reembolso o el impuesto que debes.
  h3-ade5c7: Crédito por hijos (CTC)
  p-8adaa9: El CTC ayuda a las familias criando hijos por medio de un crédito tributario de hasta <fg-show path="/maxCtcAmount"/> por cada hijo calificado.
  p-fbbde4: <modal-link for="modal-ctc-who-can-claim">¿Quién puede reclamar el CTC?</modal-link>
  /ctcEligibleDependents:
    question: Número de hijos
    hint: No cuentes a un hijo si no tiene número de Seguro Social (SSN) válido para trabajar. Si <span condition="/isFilingStatusMFJ" operator="isFalse">tú no tienes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tú y tu esposo(a) no tienen</span> un SSN, deja esta casilla en blanco.
  h3-6a0442: Crédito por otros dependientes (ODC)
  p-5b5094: Los contribuyentes que no califican para el Crédito tributario por hijos, podrían reclamar el ODC.
  p-386206: <modal-link for="modal-odc-who-can-claim">¿Quién puede reclamar el ODC?</modal-link>
  /odcEligibleDependents:
    question: Número de otros dependientes
    hint: Deja esta casilla en blanco si no eres un ciudadano, nacional, o residente legal de los Estados Unidos. No incluyas dependientes que ya mencionaste en el Crédito por hijos.
  h3-bd6ff3: Crédito por el cuidado de hijos y dependientes (CDCC)
  p-b0becb: El CDCC ayuda a los contribuyentes que pagan por el cuidado de un familiar o de un miembro del hogar mientras trabajan o buscan trabajo.
  p-c6bd24: <modal-link for="modal-cdcc-who-can-claim-and-eligible-expenses">¿Quién puede reclamar el CDCC y cuáles gastos son elegibles?</modal-link>
  /cdccQualifyingPersons:
    question: Número de hijos y dependientes calificados
  /cdccQualifyingExpenses:
    question: Gastos anuales estimados para el <fg-show path="/taxYear"/>
    hint: (El máximo es <fg-show path="/cdccMaxClaimableExpenseWithOneQP"/> para una persona y <fg-show path="/cdccMaxClaimableExpenseWithTwoQP"/> para dos o más personas)
  h3-f87a1a: Crédito por ingreso del trabajo (EITC)
  p-623bc8: El EITC ayuda a los trabajadores y familias de ingresos bajos a moderados a reducir sus impuestos.
  p-4b9b00: <modal-link for="modal-eitc-who-can-claim">¿Quién puede reclamar el crédito por ingreso del trabajo (EITC)?</modal-link>
  /eitcQualifyingChildren:
    question: Número de hijos calificados
    hint: No cuentes a un hijo si no tiene un número de Seguro Social. Si <span condition="/isFilingStatusMFJ" operator="isFalse">tú no tienes</span><span condition="/isFilingStatusMFJ" operator="isTrue">tú o tu esposo(a) no tienen</span> un SSN, deja esta casilla en blanco.
  /primaryFilerAge25OrOlderForEitc:
    question: ¿Tendrás 25 años o más para el 1 de enero del <fg-show path="/nextTaxYear"/>?
    hint: Elige “No” si no tienes un número de Seguro Social.
  /secondaryFilerAge25OrOlderForEitc:
    question: ¿Tu esposo(a) tendrá 25 años o más para el 1 de enero del <fg-show path="/nextTaxYear"/>?
    hint: Elige “No” si no tiene un número de Seguro Social.
  h3-d83ef2: Crédito del ahorrador
  p-5661e0: El crédito del ahorrador es un beneficio tributario que ayuda a los contribuyentes de ingresos bajos a moderados a ahorrar para la jubilación. Ingresa el monto total del crédito que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> reclamar por contribuciones a una cuenta IRA tradicional, Roth IRA, 401(k), 403(b), o planes similares.
  p-8c58ba: <modal-link for="modal-retirement-savings-credit-who-can-claim">¿Quién puede reclamar el crédito del ahorrador y cómo puedo estimarlo?</modal-link>
  /retirementSavingsContributionsTaxCreditAmount:
    question: Crédito del ahorrador <span condition="/isFilingStatusMFJ" operator="isFalse">que piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">que piensan</span> tomar en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/retirementSavingsContributionsMaximumAmount"/>)
  h3-63f260: Crédito de la oportunidad estadounidense (AOTC)
  p-1a3e61: El AOTC ayuda a compensar el costo de la matrícula, cuotas y otros gastos durante los primeros cuatro años de la universidad.
  p-48ee6d: <modal-link for="modal-aotc-who-can-claim-and-eligible-expenses">¿Quién puede reclamar el crédito de AOTC y qué tipos de gastos califican?</modal-link>
  /qualifyingStudents:
    question: Número de estudiantes universitarios
  /aotcQualifiedEducationExpenses:
    question: Monto estimado de costos o matrícula universitaria en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/maxAotcAdjustedQualifiedExpenseCap"/> por estudiante)
  h3-5869f0: Crédito vitalicio de educación (LLC)
  p-dbcaea: El LLC ayuda a compensar el costo de cursos universitarios, certificaciones profesionales y capacitaciónes para habilidades laborales. No puedes reclamar el AOTC y el LLC para el mismo estudiante.
  p-4e793b: <modal-link for="modal-llc-who-can-claim">¿Quién puede reclamar el LLC?</modal-link>
  /llcQualifiedEducationExpenses:
    question: Monto estimado de costos o matrícula universitaria en el <fg-show path="/taxYear"/>
    hint: (máximo $10,000)
  h3-40bd58: Crédito por adopción
  p-6d6078: El crédito por adopción ayuda a las familias a compensar los costos de adoptar a un niño elegible.
  p-007627: <modal-link for="modal-adoption-credit-who-can-claim">¿Quién puede reclamar el crédito por adopción?</modal-link>
  /adoptionEligibleChildren:
    question: Número de niños adoptados
  /estimatedTotalQualifiedAdoptionExpenses:
    question: Gastos por adopción que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> tener en el <fg-show path="/taxYear"/>
    hint: (máximo <fg-show path="/maxAdoptionCreditPerChild"/> por niño)
  h3-e318a2: Crédito para adultos mayores o personas con una discapacidad
  p-371ffe: Este crédito ayuda a adultos mayores y personas con una discapacidad calificada a reducir sus impuestos.
  p-77d648: <modal-link for="modal-credit-elderly-disabled-who-can-claim">¿Quién puede reclamar el crédito para adultos mayores o personas con una discapacidad?</modal-link>
  /elderlyAndDisabledTaxCreditAmount:
    question: Monto de crédito para adultos mayores o personas con una discapacidad que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> reclamar en el <fg-show path="/taxYear"/>
  h3-8c57ba: Crédito por impuestos extranjeros
  p-3995ab: El crédito por impuestos extranjeros reduce tus impuestos en los Estados Unidos cuando pagas o debes impuestos en un país extranjero o en un territorio de los Estados Unidos.
  p-2c1569: <modal-link for="modal-foreign-tax-credit-who-can-claim">¿Quién puede reclamar el crédito por impuestos extranjeros?</modal-link>
  /schedule3Line1:
    question: Impuestos extranjeros que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> pagar en el <fg-show path="/taxYear"/>
  h3-a99804: Créditos para negocios
  p-961cbd: Los créditos empresariales incluyen varios créditos individuales que recompensan a las empresas por acciones como la contratación y apoyo a los trabajadores, las inversiones en energía o la investigación y el desarrollo.
  p-821d31: <modal-link for="modal-what-are-business-credits">¿Qué son los créditos empresariales?</modal-link>
  /schedule3Line6a:
    question: Monto de créditos para negocios que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan</span> tomar en el <fg-show path="/taxYear"/>
  h3-f75ee7: Crédito de interés hipotecario
  p-40c9a3: El crédito de interés hipotecario reduce los impuestos para propietarios de vivienda con recursos bajos o moderados y quienes reciben un certificado de crédito hipotecario de su gobierno estatal o local.
  p-46de1e: <modal-link for="modal-mortgage-interest-credit-who-can-claim">¿Quién puede reclamar el crédito de interés hipotecario?</modal-link>
  /tentativeSchedule3Line6g:
    question: Monto estimado del crédito <span condition="/isFilingStatusMFJ" operator="isFalse">por interés hipotecario que piensas</span><span condition="/isFilingStatusMFJ" operator="isTrue">de interés hipotecario que piensan</span> tomar en el <fg-show path="/taxYear"/>
    hint: (máximo $2,000)
  h3-795a8a: Crédito por el impuesto mínimo alternativo (AMT)
  p-df114f: El AMT le permite a los contribuyentes de altos ingresos recuperar el exceso de impuestos pagados bajo el AMT en años anteriores.
  p-847a3c: <modal-link for="modal-amt-who-can-claim">¿Quién puede reclamar el crédito AMT?</modal-link>
  /alternativeMinimumTaxCreditAmount:
    question: Monto del crédito AMT que <span condition="/isFilingStatusMFJ" operator="isFalse">esperas tomar</span><span condition="/isFilingStatusMFJ" operator="isTrue">esperan tomar</span> en el <fg-show path="/taxYear"/>
  modal-ctc-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por hijos (CTC)?
    p-7c2fab: "Para reclamar el CTC, debes tener un hijo(a) calificado que:"
    ul-0:
      li-a2f84f: Sea tu hijo dependiente, hijastro, hijo de crianza, hermano o descendiente (nieto, sobrino o sobrina)
      li-d11eda: Sea menor de 17 años al final del <fg-show path="/taxYear"/>
      li-a17024: Viva contigo en los Estados Unidos más de la mitad del año
      li-8b8bcb: Tenga un número de Seguro Social (SSN) válido para trabajar (tú o tu esposo(a) también deben tener un SSN)
      li-f5b72f: No se mantenga por sí mismo o piense presentar una declaración conjunta (a menos que sea para reclamar un reembolso)
    p-c67be7: Puedes reclamar hasta <fg-show path="/maxCtcAmount"/> por hijo calificado.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-e97b0b: Revisa la línea 4 en el Anexo 8812 por un número mayor a 0. El Anexo 8812 se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-23670a: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/child-tax-credit">Conoce más sobre el CTC.</a>
  modal-odc-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por otros dependientes (ODC)?
    p-25ea3f: "Para reclamar el ODC, debes tener un dependiente calificado que:"
    ul-0:
      li-ec8076: Pienses reclamar como dependiente en tu declaración de impuestos
      li-3f5be2: Tenga un ingreso bruto menor a <fg-show path="/odcDependentGrossIncomeThreshold"/>
      li-271d52: Viva contigo en los Estados Unidos más de la mitad del año si es un niño(a), o todo el año si es un adulto, a menos que sea <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p501#en_US_2024_publink1000220957">un tipo específico de pariente (en inglés)</a>
      li-3cdb99: Tenga un número de Seguro Social, número de Identificación Personal del Contribuyente (ITIN), o un número de Identificación del Contribuyente para Adopciones (ATIN)
      li-54fdde: No se mantenga a sí mismo y no piense presentar una declaración conjunta
      li-38e383: No mencionarás para reclamar el crédito por hijos
    p-b1ce93: Puedes reclamar hasta <fg-show path="/maxOdcAmount"/> por cada dependiente calificado de cualquier edad.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-a212c5: Revisa la línea 6 en el Anexo 8812 por un número mayor a 0. El Anexo 8812 se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-8e621a: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/newsroom/understanding-the-credit-for-other-dependents">Conoce más sobre el ODC.</a>
  modal-cdcc-who-can-claim-and-eligible-expenses:
    heading: ¿Quién puede reclamar el crédito por el cuidado de hijos y dependientes (CDCC) y cuáles gastos son elegibles?
    p-999ac9: Para reclamar el CDCC, debes pagar por el cuidado de un niño(a) menor de 13 años, o para tu esposo(a) o un dependiente que viva contigo y no pueda cuidar de sí mismo.
    p-0e2159: La persona que presta el cuidado no puede ser tu esposo(a), el padre del niño u otro dependiente.
    p-af5726: "Gastos que califican:"
    ul-0:
      li-b23a11: Guardería, preescolar (antes del kindergarten)
      li-6f4e69: Cuidado antes y después de la escuela
      li-594aa1: Campamentos diurnos
      li-531e5e: Cuidado para un esposo(a) o dependiente que no puede cuidar de sí mismo(a)
    p-7189e3: "Gastos que no califican:"
    ul-1:
      li-0f6e34: Campamentos de un día para otro
      li-cc9c3b: Matrícula para escuelas privadas
      li-241e17: Comida, alojamiento, o vestimenta a menos que estén directamente relacionados al cuidado
      li-dc8f3c: Pagos a tu esposo(a), el padre del hijo(a), u otro dependiente por el cuidado
    p-ee8680: Esta no es una lista completa. Revisa la <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p503#en_US_2023_publink1000203292">Publicación 503 (en inglés)</a> para conocer más sobre los gastos que califican.
    p-ded29b: Puedes reclamar hasta <fg-show path="/cdccMaxClaimableExpenseWithOneQP"/> por una persona o <fg-show path="/cdccMaxClaimableExpenseWithTwoQP"/> por dos o más personas.
    p-a01583: Si estás casado(a) y presentas una declaración separada, solo podrás reclamar este crédito si tú y tu esposo(a) están legalmente separados o viven separados y cumplen con <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p503#en_US_2023_publink1000203323">otros criterios (en inglés).</a>
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-df5230: Revisa la línea 2 en el Anexo 3. El Anexo 3 se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-6173e1: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/taxtopics/tc602">Conoce más sobre el CDCC.</a>
  modal-eitc-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por ingreso del trabajo (EITC)?
    p-787c0c: <strong>Si tienes hijos y quieres reclamar el EITC,</strong> debes ser un trabajador de ingresos bajos o moderados y tener un hijo calificado.
    p-e38ed9: "Un hijo(a) calificado para el EITC debe:"
    ul-0:
      li-df44ee: Ser tu hijo, hijastro, hijo adoptivo, hermano o descendiente (nieto, sobrino)
      li-0192a3: Ser menor de 19 años al final del <fg-show path="/taxYear"/>, menor de 24 años al final del <fg-show path="/taxYear"/> si es estudiante a tiempo completo, o de cualquier edad si tiene una discapacidad permanente
      li-5ef8aa: Vivir contigo en los Estados Unidos más de la mitad del año
      li-15bfc0: Tener un número de Seguro Social válido para trabajar
      li-1b1f15: No presentar una declaración conjunta (excepto para reclamar un reembolso)
    p-76b6a9: Puedes reclamar hasta 3 hijos calificados.
    p-d178a7: Si estás casado(a) y presentas una declaración por separado, sólo puedes reclamar este crédito si cumples con <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/earned-income-tax-credit/who-qualifies-for-the-earned-income-tax-credit-eitc#marriedfilingseparate">requisitos específicos para el EITC.</a>
    p-9e7c3b: "<strong>Si no tienes hijos y quieres reclamar el EITC,</strong>  debes ser un trabajador con ingresos bajos o moderados que:"
    ul-1:
      li-e27492: Tenga al menos 25 años pero menos de 65 al 1 de enero del <fg-show path="/nextTaxYear"/>
      li-32aee0: Haya vivido en los Estados Unidos más de la mitad del año
      li-15bfc0: Tenga un número de Seguro Social válido para trabajar
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-cdce6e: Revisa la línea 27a en el Formulario 1040 de tu declaración del impuesto federal.
    p-cda0a1: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/earned-income-tax-credit-eitc">Conoce más sobre el EITC.</a>
  modal-retirement-savings-credit-who-can-claim:
    heading: ¿Quién puede reclamar el crédito del ahorrador y cómo puedo estimarlo?
    p-82bd3c: Para reclamar el crédito del ahorrador, debes hacer contribuciones a una IRA tradicional, Roth IRA, 401(k), 403(b), o un plan similar.
    p-4d4371: "Las siguientes contribuciones no califican:"
    ul-0:
      li-51e5b0: Contribuciones o aportaciones complementarias del empleador
      li-b4ffe6: Contribuciones transferidas
    p-c1babe: Para estimar el monto de tu crédito, multiplica las contribuciones que esperas hacer en el <fg-show path="/taxYear"/> a tu plan de jubilación por <fg-show path="/retirementSavingsMultiplier"/>%. Este porcentaje se basa en tu estado civil y el estimado de tu ingreso bruto ajustado.
    p-79b58a: Puedes reclamar hasta <fg-show path="/retirementSavingsMaximumAmountNonMFJ"/> (<fg-show path="/retirementSavingsMaximumAmountMFJ"/> si presentas una declaración conjunta).
    p-d2238c: Si es difícil de estimar, puedes dejar este estimado de crédito en blanco.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-e930e0: Si esperas que el monto de ahorros para tu plan de jubilación sea parecido al del año pasado, puedes usar la misma cantidad. Revisa la línea 4 del Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-4f7230: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/taxtopics/tc610">Conoce más sobre el crédito del ahorrador.</a>
  modal-aotc-who-can-claim-and-eligible-expenses:
    heading: ¿Quién puede reclamar el crédito de la oportunidad estadounidense (AOTC) y qué tipos de gastos califican?
    p-a7fc1e: "Para reclamar el AOTC, tú, tu esposo(a) o tu dependiente debe:"
    ul-0:
      li-c490a5: Estar en los primeros 4 años de educación superior
      li-fad0e9: Estar inscrito por lo menos a medio-tiempo para una credencial o grado
    p-7f6a17: 'Puedes reclamar hasta <fg-show path="/maxAotcPerQualifyingStudent"/> por cada estudiante, incluyendo:'
    ul-1:
      li-fb3acc: 100% de los primeros $2,000 en gastos
      li-1fae55: 25% de los siguientes $2,000 en gastos
    p-1f5c56: <a target="_blank" class="usa-link" href="https://www.irs.gov/credits-deductions/individuals/qualified-ed-expenses">Los gastos educativos (en inglés)</a> incluyen matrículas, costos, libros, materiales y otros. Puedes reclamar gastos hechos por ti, tu esposo(a), tu dependiente o un tercero.
    p-26f710: Un estudiante no puede reclamar este crédito más de 4 veces.
    p-658bee: No puedes reclamar el Crédito de la oportunidad estadounidense y el Crédito vitalicio de educación para el mismo estudiante.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-a99490: Revisa la línea 27 en el Anexo 8863 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-9d7d7d: <a target="_blank" class="usa-link" href="https://www.irs.gov/credits-deductions/individuals/american-opportunity-tax-credit">Conoce más sobre el AOTC (en inglés).</a>
  modal-llc-who-can-claim:
    heading: ¿Quién puede reclamar el crédito vitalicio de educación (LLC)?
    p-f5b472: "Para reclamar el LLC, tú, tu esposo(a) o tu dependiente deben:"
    ul-0:
      li-a144eb: Pagar matrícula o costos por cursos universitarios, certificaciones profesionales o capacitaciones de habilidades laborales
      li-51b299: Inscribirse o tomar clases en <a target="_blank" class="usa-link" href="https://www.irs.gov/credits-deductions/individuals/eligible-educational-institution">una institución educativa elegible (en inglés)</a>
      li-cdf538: Inscribirse en uno o más cursos en un periodo académico del <fg-show path="/taxYear"/>
    p-52848c: Puedes reclamar hasta el 20% de los primeros $10,000 en gastos y un máximo de <fg-show path="/maxLlcAmountForTaxYear"/> por declaración de impuesto federal. Puedes reclamar gastos hechos por ti, tu esposo(a), tu dependiente o una tercera parte.
    p-839872: No puedes reclamar el Crédito de la oportunidad estadounidense y el LLC para el mismo estudiante.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-9f907d: Revisa la línea 31 en el Formulario 8863 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-5d0cbb: <a target="_blank" class="usa-link" href="https://www.irs.gov/credits-deductions/individuals/llc">Conoce más sobre el LLC (en inglés).</a>
  modal-adoption-credit-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por adopción?
    p-ab884c: "Para reclamar el crédito por adopción, tú o tu esposo(a) deben:"
    ul-0:
      li-1221c2: Tener <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/adoption-credit#qualifiedexpenses">gastos de adopción calificados</a> como costos de adopción, costos judiciales, honorarios de un abogado, o viajes
      li-7f01ec: Haber adoptado a un niño(a) menor de 18 años o una persona física o mentalmente incapaz de cuidar de sí misma
    p-837b60: Puedes reclamar hasta <fg-show path="/maxAdoptionCreditPerChild"/> en gastos calificados por un hijo(a) adoptivo. <a target="_blank" class="usa-link" href="https://www.irs.gov/instructions/i8839#en_US_2024_publink23077td0e531">Las fechas para reclamar gastos (en inglés)</a> dependen del tipo de adopción, estatus de la adopción y cuándo sucedieron los gastos.
    p-c92b21: Este crédito es parcialmente reembolsable. Puede reducir tus impuestos y darte un reembolso de hasta <fg-show path="/maxRefundableAdoptionCreditAmount"/> si reduce la cantidad que debes a $0. Los montos no utilizados pueden usarse dentro de un periodo de 5 años.
    p-0dfb21: Si estás casado(a) y presentas una declaración separada, sólo puedes reclamar este crédito si no vives con tu esposo(a) y cumples con <a target="_blank" class="usa-link" href="https://www.irs.gov/instructions/i8839#en_US_2024_publink23077td0e498">criterios adicionales (en inglés).</a>
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-e45e2b: Revisa el Formulario 8839 (Gastos de adopción calificados) que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-5683ce: <a target="_blank" class="usa-link" href="https://www.irs.gov/forms-pubs/about-form-8839">Conoce más sobre el crédito por adopción.</a>
  modal-credit-elderly-disabled-who-can-claim:
    heading: ¿Quién puede reclamar el crédito para adultos mayores o personas con una discapacidad?
    p-f6aeb3: "Podrías calificar si:"
    ul-0:
      li-b9be11: Tienes 65 años o más para el 1 de enero del <fg-show path="/nextTaxYear"/>, o estás jubilado por una discapacidad total y permanente y recibes ingresos por discapacidad tributables
      li-80d712: Tu ingreso bruto ajustado (AGI) es generalmente menos de $17,500 (o $25,000 si estás casado y presentas una declaración conjunta)
      li-486ff8: Tus ingresos no sujetos a impuestos por Seguro Social, pensiones, anualidades o discapacidad es generalmente menos de $5,000 (o $7,500 si estás casado y presentas una declaración conjunta)
    p-c6a647: Usa el <a target="_blank" class="usa-link" href="https://www.irs.gov/es/forms-pubs/about-schedule-r-form-1040">Anexo R</a> para calcular el monto del crédito.
    p-cd18b6: Si presentas una declaración como Casado(a) que presenta una declaración por separado, sólo puedes reclamar este crédito si no viviste con tu esposo(a) en ningún momento del <fg-show path="/taxYear"/>.
    p-be3be3: Si declaras impuestos como Cabeza de familia, sólo puedes reclamar este crédito si cumples con el <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p524#en_US_2023_publink100038676">criterio específico (en inglés).</a>
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-efe4ff: Revisa la línea 6d en el Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-22e34a: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/credits-deductions/individuals/credit-for-the-elderly-or-the-disabled">Conoce más sobre el crédito para adultos mayores o personas con una discapacidad.</a>
  modal-foreign-tax-credit-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por impuestos extranjeros?
    p-f75b59: "Para reclamar el crédito por impuestos extranjeros, tú o tu esposo(a) deben:"
    ul-0:
      li-4b51b6: Pagar o deber impuestos a un país extranjero o a un territorio de los Estados Unidos y
      li-2dc959: Estar sujetos al impuesto estadounidense sobre los mismos ingresos
    p-944458: Si piensas tomar la deducción detallada por impuestos extranjeros, no podrás reclamar este crédito.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-beb725: Revisa la línea 1 en el Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-913a55: <a target="_blank" class="usa-link" href="https://www.irs.gov/individuals/international-taxpayers/foreign-tax-credit">Conoce más sobre el crédito por impuestos extranjeros (en inglés).</a>
  modal-what-are-business-credits:
    heading: ¿Qué son créditos para negocios?
    p-e6c933: "Los créditos empresariales son un grupo de créditos tributarios que incluyen incentivos por actividades como:"
    ul-0:
      li-f80e57: Contrataciones y apoyo a trabajadores
      li-4715cf: Inversiones relacionadas a la energía
      li-40aa29: Investigaciones y desarrollo
    p-97e52e: Para reclamar estos créditos, podrías tener que enviar el Formulario 3800.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-a0a8dd: Revisa la línea 6a en el Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-985345: <a target="_blank" class="usa-link" href="https://www.irs.gov/es/businesses/small-businesses-self-employed/business-tax-credits">Conoce más sobre los créditos empresariales.</a>
  modal-mortgage-interest-credit-who-can-claim:
    heading: ¿Quién puede reclamar el crédito de interés hipotecario?
    p-bcd520: "Para reclamar el crédito de interés hipotecario, tú y tu esposo(a) deben:"
    ul-0:
      li-cc8a12: Tener un Certificado de Crédito Hipotecario (MCC) calificado, emitido por tu gobierno estatal o local
      li-18244c: Pagar intereses hipotecarios sobre tu vivienda principal
    p-f226d2: El MCC indicará el porcentaje de intereses que puedes reclamar como crédito. Si no tienes un MCC, no podrás reclamar este crédito.
    p-2bce1f: Este crédito está limitado a $2,000 por año.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-7b5370: Revisa la línea 6g en el Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-0ea3a2: <a target="_blank" class="usa-link" href="https://www.irs.gov/publications/p530#en_US_2023_publink100011906">Conoce más sobre el crédito de interés hipotecario (en inglés).</a>
  modal-amt-who-can-claim:
    heading: ¿Quién puede reclamar el crédito por el impuesto mínimo alternativo (AMT)?
    p-a7cc79: "Para reclamar el AMT, tú o tu esposo(a) deben:"
    ul-0:
      li-67f80f: Haber debido AMT el año anterior
      li-f5e817: No estar sujetos al AMT en el año actual
    p-63fead: Puedes reclamar este crédito con el Formulario 8801.
    p-24b934: <strong>Cómo revisar si reclamaste este crédito el año pasado</strong>
    p-cb09e9: Revisa la línea 6b en el Anexo 3 que se hubiera adjuntado y enviado con el Formulario 1040 en tu declaración del impuesto federal.
    p-dbd9a0: <a target="_blank" class="usa-link" href="https://www.irs.gov/forms-pubs/about-form-8801">Conoce más sobre el AMT (en inglés).</a>
