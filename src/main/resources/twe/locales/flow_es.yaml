                  <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">puedes reducir el dinero que recibes en cada cheque <a class="usa-link" href="#heading-adjust-withholding-for-lower-tax-balance">cambiando tus retenciones.</a></span>
                  <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isFalse">y haciendo <a class="usa-link" href="https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes">pagos del impuesto estimado</a> para cubrir la diferencia entre el cambio en tus retenciones y el impuesto que debes.</span>
                </span>
                <span condition="/mayNeedToMakeEstimatedPayments" operator="isTrue">
                  <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">puedes reducir el dinero que recibes en cada cheque <a class="usa-link" href="#heading-adjust-withholding-for-lower-tax-balance">cambiando tus retenciones</a> y haciendo <a class="usa-link" href="https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes">pagos del impuesto estimado</a> para cubrir la diferencia entre el cambio en tus retenciones y el impuesto que debes.</span>
                  <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isFalse">haciendo <a class="usa-link" href="https://www.irs.gov/businesses/small-businesses-self-employed/estimated-taxes">pagos del impuesto estimado</a> para cubrir la diferencia entre el cambio en tus retenciones y el impuesto que debes.</span>
                </span>
  p-45fe55: Según tu información, estimamos que tus retenciones actuales deberían cubrir tu impuesto federal.
  p-d8ceb8: Para establecer estas retenciones con tu nueva fuente de ingresos, llena <a class="usa-link" href="#heading-adjust-withholding"><span
    condition="/hasJobsAvailableForExtraWithholdingButNotPensions" operator="isTrue">un nuevo Formulario W-4</span><span condition="/hasPensionsAvailableForExtraWithholdingButNotJobs"
    operator="isTrue">un nuevo Formulario W-4P</span><span condition="/hasJobsAndPensionsAvailableForExtraWithholding"
    operator="isTrue">un nuevo Formulario W-4 y W-4P</span></a> usando nuestras recomendaciones.
  p-dac7cb: Según tu informacion, estimamos que <strong>estás reteniendo suficiente para cubrir tu impuesto federal.</strong> Cuando recibas tus nuevos ingresos, tu situación tributaria cambiará.
  p-2e81bb: Para mantener tus resultados, <a class="usa-link" href="#heading-adjust-withholding">cambia las retenciones</a> de tus ingresos nuevos <span condition="/hasCurrentJob" operator="isTrue">y actuales</span>.
  p-609593: Según tu informacion, estimamos que <strong>estás reteniendo suficiente para cubrir tu impuesto federal.</strong>
  p-3094c9: <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">Si mantienes tus retenciones como están, probablemente</span>
                  <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isFalse">Probablemente</span> no debas impuestos en tu declaración del impuesto federal del <fg-show path="/taxYear"/>.
  p-bf0181: Si <a class="usa-link" href="#heading-adjust-withholding">cambias tus retenciones</a>, cambiará el monto que adeudas de impuesto federal y el dinero que recibes en cada cheque.
  h3-5359f4: Reembolso estimado del impuesto federal
  h3-566afa: Deuda estimada del impuesto federal
  p-7d3cba: <fg-show path="/withholdingGap"/>
  p-c219b9: <fg-show path="/withholdingSurplus"/>
  fg-detail-10027e:
    summary: Tu cálculo
    p-afddd1: Primero calculamos tus ingresos sujetos a impuestos (tributables).
    table-0:
      caption-e01d39: Desglose de los imponibles tributables
      thead-0:
        tr-0:
          th-b5a7ad: Descripción
          th-b2f406: El monto
      tbody-0:
        tr-0:
          th-856987: Ingreso bruto
          td-17a912: <fg-show path="/grossIncomeTotal"/>
        tr-1:
          th-c91335: Deducciones de la nómina
          td-2967ae: -<fg-show path="/preTaxDeductionsTotal"/>
        tr-2:
          th-9fa8b1: Ajustes
          td-e2119c: -<fg-show path="/adjustmentsToIncome"/>
        tr-3:
          th-2eed62: <span condition="/standardDeductionWillBeUsed" operator="isTrue">Deducción estándar</span>
                            <span condition="/standardDeductionWillBeUsed" operator="isFalse">Deducción detallada</span>
          td-366809: -<fg-show path="/standardOrItemizedDeduction"/>
        tr-4:
          th-e64960: Deducciones adicionales
          td-187e4c: -<fg-show path="/additionalDeductions"/>
        tr-5:
          th-b0360a: Ingresos tributables
          td-275c50: <fg-show path="/taxableIncome"/>
    p-cec781: Luego, usamos las categorías de impuestos junto a tus ingresos tributables para estimar tu obligación tributaria en tu declaración del <fg-show path="/taxYear"/>.
    table-1:
      caption-77613d: Desglose de la obligación tributaria estimada en el <fg-show path="/taxYear"/>
      thead-0:
        tr-0:
          th-b5a7ad: Descripción
          th-b2f406: El monto
      tbody-0:
        tr-0:
          th-821cfd: Obligación tributaria estimada en el <fg-show path="/taxYear"/>
          td-828fe6: <fg-show path="/totalTaxObligationBeforeCreditsAndDeductions"/>
    p-a8bf0e: Finalmente, aplicamos tus créditos y restamos todo pago que ya hiciste hacia tus impuestos federales.
    table-2:
      caption-e87ca9: Desglose del saldo de impuestos federales
      thead-0:
        tr-0:
          th-b5a7ad: Descripción
          th-b2f406: El monto
      tbody-0:
        tr-0:
          th-948a2e: Créditos
          td-bd1cfa: -<fg-show path="/totalCredits"/>
        tr-1:
          th-7dd632: Retención del impuesto federal
          td-8a394b: -<fg-show path="/totalEndOfYearProjectedWithholding"/>
        tr-2:
          th-af2744: Pagos de impuesto estimados
          td-35558f: -<fg-show path="/totalEstimatedTaxesPaid"/>
        tr-3:
          th-80026f: <span condition="/isOverwithheld" operator="isFalse">Deuda estimada del impuesto federal del <fg-show path="/taxYear"/></span>
                            <span condition="/isOverwithheld" operator="isTrue">Reembolso estimado del impuesto federal del <fg-show path="/taxYear"/></span>
          td-1bd203: <span condition="/isOverwithheld" operator="isFalse">
                              <fg-show path="/withholdingGap"/>
                            </span>
                            <span condition="/isOverwithheld" operator="isTrue">
                              <fg-show path="/withholdingSurplus"/>
                            </span>
    p-5d3b06: Si debes por lo menos $1,000 y debes más del 10% del total del impuesto que debes pagar, podrías tener que pagar una multa además del impuesto federal que debes.
    p-09327c: 'Nota: Este estimado depende de que tu información sea precisa. El IRS no garantiza la exactitud de este estimado y no acepta cualquier responsabilidad que pueda resultar de usar este cálculo.'
  fg-alert-effbdc:
    heading: Tu estimado podría ser menos preciso porque incluye ingresos futuros
    p-e8e494: Revisa tus retenciones luego de recibir el primer talón de cheque o estado de cuenta de este nuevo ingreso.
