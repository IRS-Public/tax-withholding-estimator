  p-1a7d9b: <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">Si quisieras recibir más dinero en cada cheque y reducir tu reembolso estimado, puedes <a class="usa-link" href="#heading-adjust-withholding-for-more-take-home-pay">cambiar tus retenciones</a> a $0.</span>
  p-acd885: |-
    <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">Si mantienes tus retenciones como están, probablemente</span>
    <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isFalse">Probablemente</span> recibas un reembolso en tu declaración del impuesto federal del <fg-show path="/taxYear"/>.
  p-f27357: <span condition="/eligibleRemainingPayPeriodsGreaterThanZero" operator="isTrue">Si quisieras recibir más dinero en cada cheque y reducir tu reembolso estimado, puedes <a class="usa-link" href="#heading-adjust-withholding-for-more-take-home-pay">cambiar tus retenciones</a>.</span>
